<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画布历程瀑布流 · 交互原型</title>
<style>
  :root {
    --bg: #0e0e12;
    --surface: #17171d;
    --surface-2: #1f1f27;
    --border: rgba(255,255,255,.09);
    --border-strong: rgba(255,255,255,.2);
    --text: #e9e9f0;
    --muted: #9a9aa8;
    --brand: #0FDC78;
    --brand-dim: rgba(15,220,120,.14);
    --brand-text: #7dffbe;
    --danger: #ff5d5d;
    --danger-dim: rgba(255,93,93,.12);
    --warn: #ffb648;
    --card-min: 220px;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "PingFang SC", "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ============ 顶栏 ============ */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(14,14,18,.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px 8px;
  }
  .tb-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tb-title { font-weight: 600; font-size: 14.5px; letter-spacing: .2px; white-space: nowrap; }
  .tb-title em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .tb-progress { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 220px; }
  .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; background: var(--brand); border-radius: 3px; transition: width .3s ease; }
  .bar-num { font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .activity { font-size: 11.5px; color: var(--brand-text); white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .activity:empty::before { content: "—"; color: var(--muted); }
  .tb-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--border-strong); }
  .btn.primary { background: var(--brand); color: #052b18; border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: default; }
  select.btn { appearance: none; -webkit-appearance: none; padding-right: 22px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><path d='M0 0l4 5 4-5z' fill='%239a9aa8'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center; }
  .pop-wrap { position: relative; }
  .pop {
    position: absolute; right: 0; top: calc(100% + 8px); width: 300px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; box-shadow: 0 16px 48px rgba(0,0,0,.55);
    max-height: 72vh; overflow: auto; z-index: 80; display: none;
  }
  .pop.open { display: block; }
  .pop h4 { margin: 2px 0 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .pop label { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  .pop label:hover { background: var(--surface-2); }
  .pop label small { color: var(--muted); font-size: 10.5px; margin-left: auto; font-family: ui-monospace, monospace; }
  .pop label.off { opacity: .45; }
  .pop input { accent-color: var(--brand); }
  .pop .sep { border-top: 1px dashed var(--border); margin: 6px 0; }
  .tb-row2 { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stage-chip {
    font-size: 11.5px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px; cursor: pointer; background: transparent;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .stage-chip:hover { border-color: var(--border-strong); color: var(--text); }
  .stage-chip .st-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .stage-chip.done { color: var(--brand-text); border-color: rgba(15,220,120,.35); }
  .stage-chip.done .st-dot { background: var(--brand); }
  .stage-chip.running .st-dot { background: var(--brand); animation: blink 1s ease-in-out infinite; }
  .stage-chip.hasfail { color: var(--danger); border-color: rgba(255,93,93,.4); }
  .stage-chip.hasfail .st-dot { background: var(--danger); }
  @keyframes blink { 50% { opacity: .3; } }
  .legend { margin-left: auto; font-size: 11px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .legend b { font-weight: 400; }
  .legend .ok::before { content: "●"; color: var(--brand); margin-right: 3px; }
  .legend .run::before { content: "◐"; color: var(--brand); margin-right: 3px; }
  .legend .wait::before { content: "○"; color: var(--muted); margin-right: 3px; }
  .legend .fail::before { content: "⚠"; color: var(--danger); margin-right: 3px; }

  /* ============ 主流区 ============ */
  .stream { max-width: 1120px; margin: 0 auto; padding: 26px 20px 80px; }
  .stage { position: relative; padding-bottom: 30px; }
  .stage::before {
    content: ""; position: absolute; left: 16px; top: 40px; bottom: 14px;
    width: 2px; background: linear-gradient(var(--border) 70%, transparent);
  }
  .stage:last-child::before { display: none; }
  .stage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .dot {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--surface); border: 2px solid var(--brand); color: var(--brand);
    font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }
  .stage.done .dot { background: var(--brand); color: #052b18; }
  .stage-txt h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .stage-txt p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); }
  .stage-status {
    margin-left: auto; font-size: 11.5px; border-radius: 999px; padding: 2px 10px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .stage.done .stage-status { color: var(--brand-text); border-color: rgba(15,220,120,.35); }
  .stage.hasfail .stage-status { color: var(--danger); border-color: rgba(255,93,93,.4); }

  .sec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); gap: 12px; }
  .wide { grid-column: span 2; }
  @media (max-width: 640px) { .wide { grid-column: span 1; } :root { --card-min: 160px; } }

  /* 托盘 */
  .tray {
    border: 1px solid var(--border); border-radius: 14px;
    background: rgba(255,255,255,.022);
    padding: 10px 10px 12px; margin-bottom: 14px;
    transition: border-color .2s;
  }
  .tray.running { border-color: rgba(15,220,120,.4); }
  .tray.hasfail { border-color: rgba(255,93,93,.45); }
  .tray-head { display: flex; align-items: center; gap: 10px; padding: 2px 4px 10px; }
  .shot-no {
    font-weight: 600; color: var(--brand-text); font-size: 11.5px;
    background: var(--brand-dim); border: 1px solid rgba(15,220,120,.3);
    border-radius: 8px; padding: 2px 9px; white-space: nowrap;
  }
  .shot-card {
    flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted);
    border-left: 2px solid var(--border); padding-left: 9px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tray-status { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tray-status.fail { color: var(--danger); }
  .tray-status.run { color: var(--brand-text); }
  .tray-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); gap: 10px; }
  .row-span { grid-column: 1 / -1; }

  /* ============ 节点卡 ============ */
  .node {
    position: relative; border-radius: 12px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border);
    transition: border-color .18s, transform .18s; cursor: default;
  }
  .node:hover { border-color: var(--border-strong); }
  .node.done { cursor: zoom-in; }
  .node .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; }
  .node .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .node.pending .thumb img, .node.pending .aimg, .node.blocked .thumb img, .node.blocked .aimg { opacity: .22; filter: grayscale(.7); }
  .node.running .thumb img { opacity: .5; filter: saturate(.6); }
  .veil {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: var(--muted); background: rgba(14,14,18,.45);
  }
  .node.pending .thumb, .node.blocked .thumb { outline: 1px dashed rgba(255,255,255,.14); outline-offset: -6px; }
  .node.running .thumb::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(110deg, transparent 32%, rgba(255,255,255,.13) 50%, transparent 68%);
    transform: translateX(-100%); animation: sweep 1.15s infinite;
  }
  @keyframes sweep { to { transform: translateX(100%); } }
  .spin {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.18); border-top-color: var(--brand);
    animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0%; background: var(--brand); transition: width .12s linear; z-index: 2; }
  .node.failed { border-color: rgba(255,93,93,.55); }
  .node.failed .veil { color: var(--danger); }
  .retry {
    border: 1px solid rgba(255,93,93,.5); color: var(--danger); background: var(--danger-dim);
    border-radius: 8px; padding: 3px 12px; font-size: 12px; cursor: pointer;
  }
  .retry:hover { background: rgba(255,93,93,.22); }

  .meta { display: flex; align-items: center; gap: 6px; padding: 7px 10px 8px; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 6px; flex: none;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); letter-spacing: .5px;
  }
  .n-title { font-size: 12.5px; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src {
    font-size: 10.5px; flex: none; color: var(--brand-text);
    background: var(--brand-dim); border-radius: 6px; padding: 1px 7px; white-space: nowrap;
  }
  .aux-tag { font-size: 10px; color: var(--muted); border: 1px dashed var(--border); border-radius: 6px; padding: 1px 6px; flex: none; }

  .acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; z-index: 3; }
  .node:hover .acts { opacity: 1; }
  .act {
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
    background: rgba(8,8,12,.74); border: 1px solid var(--border); color: var(--text);
    font-size: 11px; display: flex; align-items: center; justify-content: center;
  }
  .act:hover { border-color: var(--border-strong); }

  .play-c {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 34px; height: 34px; border-radius: 50%; z-index: 2;
    background: rgba(8,8,12,.6); border: 1px solid rgba(255,255,255,.3);
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff;
  }
  .dur {
    position: absolute; right: 8px; bottom: 8px; z-index: 2;
    font-size: 10.5px; background: rgba(8,8,12,.72); border-radius: 6px; padding: 1px 6px;
    color: #ddd; font-variant-numeric: tabular-nums;
  }

  /* 音频卡 */
  .node.audio { cursor: default; }
  .audio-body { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .aimg { width: 44px; height: 44px; border-radius: 9px; object-fit: cover; flex: none; }
  .a-play {
    width: 30px; height: 30px; border-radius: 50%; flex: none; cursor: pointer;
    background: var(--brand-dim); border: 1px solid rgba(15,220,120,.4); color: var(--brand-text);
    display: flex; align-items: center; justify-content: center; font-size: 10px;
  }
  .wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 26px; min-width: 0; }
  .wave i { flex: 1; min-width: 1.5px; max-width: 4px; border-radius: 2px; background: rgba(15,220,120,.55); }
  .a-dur { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

  /* 文本卡 */
  .node.text .txt { padding: 11px 13px 12px; }
  .txt .t-label { font-size: 10px; color: var(--muted); letter-spacing: .8px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
  .txt .t-body { font-size: 12.5px; line-height: 1.6; color: var(--text); }
  .node.sticky { background: #2b2415; border-color: rgba(255,182,72,.35); }
  .node.sticky .t-body { color: #ffd9a0; }
  .node.sticky .t-label { color: rgba(255,182,72,.75); }

  /* 其他节 */
  .empty-hint { font-size: 12px; color: var(--muted); padding: 8px 2px; }

  /* ============ 灯箱 ============ */
  .lb {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: rgba(5,5,8,.85); backdrop-filter: blur(8px); cursor: zoom-out;
  }
  .lb.open { display: flex; }
  .lb img { max-width: 86vw; max-height: 78vh; border-radius: 14px; border: 1px solid var(--border-strong); box-shadow: 0 24px 80px rgba(0,0,0,.6); }
  .lb .lb-cap { font-size: 13px; color: var(--text); }
  .lb .lb-cap small { display: block; text-align: center; color: var(--muted); font-size: 11px; margin-top: 3px; }

  .foot { max-width: 1120px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 11.5px; line-height: 1.8; }
  .foot b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-row">
    <span class="tb-title">创作历程 · 瀑布流视图<em>交互原型 · 数据为模拟</em></span>
    <div class="tb-progress">
      <div class="bar"><i id="barFill"></i></div>
      <span class="bar-num" id="barNum">0/0</span>
      <span class="activity" id="activity"></span>
    </div>
    <div class="tb-btns">
      <button class="btn primary" id="btnRun">▶ 模拟生成</button>
      <button class="btn" id="btnAll">⏩ 全部完成</button>
      <button class="btn" id="btnFail">⚠ 含失败重跑</button>
      <button class="btn" id="btnReset">↺ 重置</button>
      <button class="btn" id="btnFollow">跟随滚动 ✓</button>
      <div class="pop-wrap">
        <button class="btn" id="btnTypes">节点类型 ▾</button>
        <div class="pop" id="typePop"></div>
      </div>
      <select class="btn" id="selShots" title="分镜数量">
        <option value="3">3 镜</option>
        <option value="6" selected>6 镜</option>
        <option value="9">9 镜</option>
        <option value="12">12 镜（高压测试）</option>
      </select>
      <select class="btn" id="selDensity" title="卡片密度">
        <option value="220">舒适</option>
        <option value="168">紧凑</option>
      </select>
    </div>
  </div>
  <div class="tb-row2">
    <div id="stageChips" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    <div class="legend">
      <b class="ok">完成</b><b class="run">生成中</b><b class="wait">待生成</b><b class="fail">失败</b>
      <b style="opacity:.7">点击卡片预览 · hover 显示操作</b>
    </div>
  </div>
</header>

<main class="stream" id="stream"></main>

<div class="foot">
  <b>阅读约定</b>：自上而下 = 创作阶段推进；每个分镜一个「素材托盘」，托盘头部即分镜卡（归属锚点）；镜内顺序 = 分镜卡 → 关键帧 → 视频 → 末帧(辅助，默认折叠) → 配音。
  生成中的新产出会插入所属阶段并跟随滚动，进度条与阶段徽标实时推进。<br>
  <b>原型说明</b>：缩略图由 AI 生成的占位素材，跨镜做了色相偏移以模拟多镜差异；所有数据为前端假数据，仅用于验证「归属明确 · 阶段明确 · 画布整洁」的展示形态。
</div>

<div class="lb" id="lb">
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
/* ================= 类型清单（对齐项目真实节点 / toolName） ================= */
const STAGES = [
  { id: 'creative', name: '创意概念', hint: '需求 · 剧本 · 角色/场景/风格资产', rank: 0 },
  { id: 'shots',    name: '分镜产出', hint: '每镜一个素材托盘：分镜卡 → 关键帧 → 视频 → 配音', rank: 1 },
  { id: 'audio',    name: '音频',     hint: 'BGM 与全局音频', rank: 2 },
  { id: 'film',     name: '合成成片', hint: '文案 + 最终合成', rank: 3 },
  { id: 'other',    name: '其他 · 未归类', hint: '解析不出阶段的节点进此兜底，绝不丢失', rank: 4 },
];
const TYPES = {
  brief:      { stage:'creative', kind:'text',  label:'创意需求',   tool:'user_brief', rank:0 },
  ref:        { stage:'creative', kind:'image', label:'参考素材',   tool:'上传 / 参考图', rank:1 },
  script:     { stage:'creative', kind:'text',  label:'剧本',       tool:'write_screenplay', rank:2 },
  concept:    { stage:'creative', kind:'image', label:'概念图',     tool:'image_generate · look', rank:3 },
  character:  { stage:'creative', kind:'image', label:'角色图',     tool:'image_generate · look', rank:4 },
  turnaround: { stage:'creative', kind:'image', label:'角色四视图', tool:'character_sheet', rank:5 },
  scene:      { stage:'creative', kind:'image', label:'场景概念图', tool:'image_generate · look', rank:6 },
  style:      { stage:'creative', kind:'image', label:'风格样张',   tool:'style-grid', rank:7 },
  card:       { stage:'shots', kind:'text',  label:'分镜卡',       tool:'submit_storyboard_for_approval', rank:0, structural:true },
  keyframe:   { stage:'shots', kind:'image', label:'关键帧',       tool:'image_generate · 绑镜', rank:1 },
  video:      { stage:'shots', kind:'video', label:'分镜视频',     tool:'video_generate', rank:2 },
  lastframe:  { stage:'shots', kind:'image', label:'末帧（辅助）', tool:'extract_last_frame', rank:3, aux:true, defaultOff:true },
  voice:      { stage:'shots', kind:'audio', label:'分镜配音',     tool:'speech', rank:4 },
  bgm:        { stage:'audio', kind:'audio', label:'BGM',          tool:'music_generation', rank:0 },
  copy:       { stage:'film',  kind:'text',  label:'口播文案',     tool:'write_script', rank:0 },
  final:      { stage:'film',  kind:'video', label:'最终成片',     tool:'compose', rank:1 },
  sticky:     { stage:'other', kind:'sticky',label:'便签 / 备注',  tool:'未识别兜底', rank:0 },
};
const TYPE_ORDER = ['brief','ref','script','concept','character','turnaround','scene','style',
                    'card','keyframe','video','lastframe','voice','bgm','copy','final','sticky'];

const IMG = {
  concept:'assets/concept.jpg', character:'assets/character.jpg', turnaround:'assets/turnaround.jpg',
  scene:'assets/scene.jpg', style:'assets/style.jpg', kf:['assets/kf-market.jpg','assets/kf-hands.jpg','assets/chase.jpg','assets/style.jpg','assets/scene.jpg','assets/concept.jpg'],
};
const KF_TITLES = ['夜市骑行','雨伞下交接','天台奔跑','巷口回眸','霓虹反射','包裹特写','雨夜穿行','楼道追逐','橱窗驻足','天桥远望'];
const SHOT_TEXT = [
  '雨夜巷口，骑手阿川接下订单，车筐里的包裹微微发光。',
  '夜市人流中穿行，霓虹灯牌在雨里晕成一片色斑。',
  '面馆窗外一闪而过，蒸汽糊住了玻璃。',
  '屋檐下交接包裹，两只手在伞下短暂停留。',
  '包裹的亮光穿透雨幕，引来了不该有的注意。',
  '天台狂奔，身后城市灯火像退潮一样远去。',
  '巷子尽头，阿川回头，雨顺着帽檐连成线。',
  '收件人打开包裹，光映亮了半张脸。',
  '雨停了，巷子安静下来，只剩水滴声。',
  '清晨的第一班车驶过巷口，故事结束。',
  '便利店灯光下，阿川数着今天的单量。',
  '手机屏幕亮起：新的订单，新的雨夜。',
];
const CREATIVE_TEXT = {
  brief: '拍一支 60 秒都市夜行短片：外卖骑手雨夜穿行霓虹巷，把一个会发光的包裹送到天台。情绪基调：孤独但温柔。',
  script: '《霓虹快递》分场剧本\n1. 巷口接单（雨夜 / 霓虹 / 包裹微光）\n2. 夜市穿行（人流 / 晃动镜头）\n3. 屋檐交接（特写 / 伞下停顿）\n4. 天台奔跑（逆光剪影）\n5. 巷尾回望（雨线收束）',
  copy: '口播文案：这座城市的夜里，有人替所有人奔跑。雨很大，路很滑，但包裹比雨更亮。它不是外卖，是一个约定。',
};

/* ================= 状态 ================= */
const state = {
  shotCount: 6,
  enabled: new Set(Object.keys(TYPES).filter(k => !TYPES[k].defaultOff)),
  nodes: [],
  follow: true,
  running: false,
  activity: '',
};
let timers = [];
const FAIL_PLAN = ['keyframe', 'video'];   // 含失败模式：镜2关键帧、镜5视频

function buildProject() {
  const nodes = []; let seq = 0;
  const add = (type, shot, extra) => {
    const def = TYPES[type];
    nodes.push(Object.assign({
      id: `n${seq++}`, type, stage: def.stage, kind: def.kind,
      shot: shot ?? null, status: 'pending', pct: 0,
      order: def.stage === 'shots' ? 10000 + (shot ?? 0) * 100 + def.rank
                                   : STAGES.find(s => s.id === def.stage).rank * 10000 + def.rank * 10,
    }, extra));
  };
  add('brief', null, { title: '创意需求', text: CREATIVE_TEXT.brief });
  add('ref', null, { title: '参考图 · 赛博夜景', img: IMG.concept, hue: 0 });
  add('script', null, { title: '《霓虹快递》剧本', text: CREATIVE_TEXT.script, wide: true });
  add('concept', null, { title: '整体概念图 · 雨夜霓虹巷', img: IMG.concept, hue: 0 });
  add('character', null, { title: '角色图 · 骑手阿川', img: IMG.character, hue: 0, portrait: true });
  add('turnaround', null, { title: '角色四视图 · 阿川', img: IMG.turnaround, hue: 0 });
  add('scene', null, { title: '场景概念图 · 面馆', img: IMG.scene, hue: 0 });
  add('style', null, { title: '风格样张 · 青橙调', img: IMG.style, hue: 0 });
  for (let s = 1; s <= state.shotCount; s++) {
    add('card', s, { title: `分镜 ${s}`, text: SHOT_TEXT[(s - 1) % SHOT_TEXT.length] });
    const kfCount = (s % 3 === 2) ? 2 : 1;
    for (let k = 0; k < kfCount; k++) {
      add('keyframe', s, {
        title: `关键帧 · ${KF_TITLES[(s - 1 + k * 3) % KF_TITLES.length]}`,
        img: IMG.kf[(s + k) % IMG.kf.length],
        hue: (s * 37 + k * 61) % 360,
      });
    }
    add('video', s, {
      title: `分镜视频 · 镜 ${s}`,
      img: IMG.kf[(s + 2) % IMG.kf.length], hue: (s * 53) % 360,
      dur: `00:0${4 + (s % 4)}`,
    });
    add('lastframe', s, { title: `末帧 · 镜 ${s}`, img: IMG.kf[(s + 4) % IMG.kf.length], hue: (s * 23) % 360 });
    if (s % 2 === 1) add('voice', s, { title: `旁白 · 第 ${s} 镜`, dur: `00:0${6 + (s % 3)}` });
  }
  add('bgm', null, { title: 'BGM · 雨夜霓虹 (Lo-fi)', img: IMG.style, dur: '01:00' });
  add('copy', null, { title: '口播文案', text: CREATIVE_TEXT.copy, wide: true });
  add('final', null, { title: '最终成片 ·《霓虹快递》', img: IMG.final, hue: 0, dur: '01:00', focal: true });
  add('sticky', null, { title: '便签', text: '补一个雨伞开合的特写，用在镜 4 转场。' });
  state.nodes = nodes;
}

const visible = () => state.nodes.filter(n => state.enabled.has(n.type));
const nodeById = id => state.nodes.find(n => n.id === id);

function depsOf(n) {
  const vis = visible();
  const same = t => vis.filter(m => m.shot === n.shot && m.type === t);
  switch (n.type) {
    case 'keyframe':  return same('card');
    case 'video':     return same('keyframe');
    case 'lastframe': return same('video');
    case 'copy':      return vis.filter(m => m.type === 'script');
    case 'final':     return vis.filter(m => m.type === 'video' || m.type === 'bgm' || m.type === 'copy');
    default:          return [];
  }
}

/* ================= 渲染 ================= */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/\n/g, '<br>'); }

function statusLayer(n) {
  if (n.status === 'done') return '';
  if (n.status === 'pending') return `<div class="veil"><span>待生成</span></div>`;
  if (n.status === 'blocked') return `<div class="veil"><span>上游失败 · 暂缓</span></div>`;
  if (n.status === 'running') return `<div class="veil"><div class="spin"></div><span>生成中 ${Math.floor(n.pct)}%</span></div><div class="prog" style="width:${n.pct}%"></div>`;
  if (n.status === 'failed') return `<div class="veil"><span>⚠ 生成失败</span><button class="retry" data-retry="${n.id}">重试</button></div>`;
  return '';
}
function hueStyle(n) { return n.hue ? `style="filter:hue-rotate(${n.hue}deg) saturate(1.05);"` : ''; }

function renderNode(n) {
  const def = TYPES[n.type];
  const cls = ['node', n.kind, n.status, n.wide ? 'wide' : '', n.focal ? 'focal' : ''].filter(Boolean).join(' ');
  const src = n.shot ? `<span class="src">镜 ${n.shot}</span>` : '';
  const aux = def.aux ? `<span class="aux-tag">辅助</span>` : '';
  const acts = `<div class="acts">
      <span class="act" title="改提示词">✎</span>
      <span class="act" title="重新生成">↻</span>
      <span class="act" title="更多">⋯</span>
    </div>`;
  let body = '';
  if (n.kind === 'image') {
    body = `<div class="thumb"><img src="${n.img}" ${hueStyle(n)} alt="" loading="lazy">${statusLayer(n)}</div>
      <div class="meta"><span class="badge">图</span><span class="n-title">${esc(n.title)}</span>${aux}${src}</div>`;
  } else if (n.kind === 'video') {
    body = `<div class="thumb"><img src="${n.img}" ${hueStyle(n)} alt="" loading="lazy">
        <div class="play-c">▶</div><span class="dur">${n.dur}</span>${statusLayer(n)}</div>
      <div class="meta"><span class="badge">视频</span><span class="n-title">${esc(n.title)}</span>${src}</div>`;
  } else if (n.kind === 'audio') {
    const bars = Array.from({ length: 26 }, (_, i) => {
      const h = 18 + Math.abs(Math.sin((n.id.charCodeAt(1) * (i + 3)) % 17)) * 78;
      return `<i style="height:${h.toFixed(0)}%"></i>`;
    }).join('');
    body = `<div class="audio-body">
        <img class="aimg" src="${n.img}" ${hueStyle(n)} alt="">
        <span class="a-play">▶</span>
        <div class="wave">${bars}</div>
        <span class="a-dur">${n.dur}</span>
      </div>
      <div class="meta" style="padding-top:0"><span class="badge">音频</span><span class="n-title">${esc(n.title)}</span>${src}</div>`;
  } else if (n.kind === 'text') {
    body = `<div class="txt">
        <div class="t-label"><span class="badge">文本</span>${esc(def.label)}</div>
        <div class="t-body">${esc(n.text)}</div>
      </div>${acts}`;
  } else { /* sticky */
    body = `<div class="txt">
        <div class="t-label"><span class="badge" style="color:var(--warn);border-color:rgba(255,182,72,.4)">便签</span>${esc(def.label)}</div>
        <div class="t-body">${esc(n.text)}</div>
      </div>${acts}`;
  }
  if (n.kind === 'image' || n.kind === 'video') body += acts;
  return `<div class="${cls}" data-id="${n.id}">${body}</div>`;
}

function trayStatusInfo(nodes) {
  const total = nodes.length;
  const done = nodes.filter(n => n.status === 'done').length;
  const run = nodes.some(n => n.status === 'running');
  const fail = nodes.filter(n => n.status === 'failed').length;
  const block = nodes.filter(n => n.status === 'blocked').length;
  const pend = nodes.some(n => n.status === 'pending');
  let cls = '', txt = `${done}/${total}`;
  if (fail) { cls = 'fail'; txt += ` · ${fail} 失败`; }
  if (block) { txt += ` · ${block} 暂缓`; }
  if (!fail && run) { cls = 'run'; txt += ' · 生成中'; }
  else if (!fail && pend) txt += ' · 待生成';
  return { cls, txt };
}

function renderTray(shot, vis) {
  const nodes = vis.filter(n => n.shot === shot).sort((a, b) => a.order - b.order);
  const card = nodes.find(n => n.type === 'card');
  const info = trayStatusInfo(nodes);
  const trayCls = ['tray', info.cls === 'run' ? 'running' : '', info.cls === 'fail' ? 'hasfail' : ''].filter(Boolean).join(' ');
  const grid = nodes.filter(n => n.type !== 'card').map(n =>
    renderNode(n).replace('class="node ', n.kind === 'audio' ? 'class="node row-span audio ' : 'class="node ')
  ).join('');
  return `<div class="${trayCls}" data-shot="${shot}">
    <div class="tray-head">
      <span class="shot-no">镜 ${shot}</span>
      <span class="shot-card">${card ? esc(card.text) : ''}</span>
      <span class="tray-status ${info.cls}">${info.txt}</span>
    </div>
    <div class="tray-grid">${grid}</div>
  </div>`;
}

function stageShell(st, body, nodes) {
  const done = nodes.filter(n => n.status === 'done').length;
  const fail = nodes.filter(n => n.status === 'failed').length;
  const run = nodes.some(n => n.status === 'running');
  const allDone = done === nodes.length;
  const cls = ['stage', allDone ? 'done' : '', fail ? 'hasfail' : ''].filter(Boolean).join(' ');
  const stTxt = fail ? `${done}/${nodes.length} · ${fail} 失败` : allDone ? `${done}/${nodes.length} · 已完成` : `${done}/${nodes.length}`;
  return `<section class="${cls}" id="stage-${st.id}" data-stage="${st.id}">
    <div class="stage-head">
      <span class="dot">${allDone && !fail ? '✓' : STAGES.indexOf(st) + 1}</span>
      <div class="stage-txt"><h2>${st.name}</h2><p>${st.hint}</p></div>
      <span class="stage-status">${stTxt}${run ? ' · 进行中' : ''}</span>
    </div>
    ${body}
  </section>`;
}

function render() {
  const vis = visible();
  const stream = document.getElementById('stream');
  const parts = [];
  for (const st of STAGES) {
    const nodes = vis.filter(n => n.stage === st.id);
    if (!nodes.length) continue;
    if (st.id === 'shots') {
      const shots = [...new Set(nodes.map(n => n.shot))].sort((a, b) => a - b);
      parts.push(stageShell(st, shots.map(s => renderTray(s, nodes)).join(''), nodes));
    } else {
      parts.push(stageShell(st, `<div class="sec-grid">${nodes.map(renderNode).join('')}</div>`, nodes));
    }
  }
  stream.innerHTML = parts.join('');
  updateStrip();
}

function refreshNode(n) {
  const el = document.querySelector(`[data-id="${n.id}"]`);
  if (!el) { render(); return; }
  const tpl = document.createElement('template');
  tpl.innerHTML = renderNode(n).trim();
  el.replaceWith(tpl.content.firstChild);
  refreshTrayOf(n);
  updateStrip();
}
function refreshTrayOf(n) {
  if (n.shot == null) return;
  const tray = document.querySelector(`.tray[data-shot="${n.shot}"]`);
  if (!tray) return;
  const nodes = visible().filter(m => m.shot === n.shot);
  const info = trayStatusInfo(nodes);
  tray.classList.toggle('running', info.cls === 'run');
  tray.classList.toggle('hasfail', info.cls === 'fail');
  const st = tray.querySelector('.tray-status');
  st.className = `tray-status ${info.cls}`;
  st.textContent = info.txt;
}

function updateStrip() {
  const vis = visible();
  const done = vis.filter(n => n.status === 'done').length;
  const fail = vis.filter(n => n.status === 'failed').length;
  document.getElementById('barFill').style.width = vis.length ? `${done / vis.length * 100}%` : '0%';
  document.getElementById('barNum').textContent = `${done}/${vis.length}${fail ? ` · ${fail} 失败` : ''}`;
  document.getElementById('activity').textContent = state.activity;
  const chips = [];
  for (const stDef of STAGES) {
    const nodes = vis.filter(n => n.stage === stDef.id);
    if (!nodes.length) continue;
    const d = nodes.filter(n => n.status === 'done').length;
    const f = nodes.filter(n => n.status === 'failed').length;
    const r = nodes.some(n => n.status === 'running');
    const cls = f ? 'hasfail' : r ? 'running' : d === nodes.length ? 'done' : '';
    chips.push(`<button class="stage-chip ${cls}" data-goto="stage-${stDef.id}">
      <span class="st-dot"></span>${stDef.name} ${d}/${nodes.length}</button>`);
  }
  document.getElementById('stageChips').innerHTML = chips.join('');
}

/* ================= 模拟引擎 ================= */
function stopTimers() { timers.forEach(clearInterval); timers = []; }
let activeCount = 0;

function cascadeBlock() {
  // 上游 failed/blocked → 下游 pending 逐层置为 blocked（暂缓），直到不动点。
  let changed = true;
  while (changed) {
    changed = false;
    for (const n of state.nodes) {
      if (n.status !== 'pending') continue;
      const deps = depsOf(n);
      if (deps.some(d => d.status === 'failed' || d.status === 'blocked')) {
        n.status = 'blocked'; changed = true;
      }
    }
  }
}

function releaseBlocked() {
  // 上游补齐后，被暂缓的节点回到 pending。
  for (const n of state.nodes) {
    if (n.status !== 'blocked') continue;
    if (depsOf(n).every(d => d.status === 'done')) n.status = 'pending';
  }
}

function startRun(withFail) {
  stopTimers();
  state.running = true;
  activeCount = 0;
  updateControls();
  const tick = () => {
    if (!state.running) return;
    const vis = visible();
    const ready = vis.filter(n => n.status === 'pending'
      && depsOf(n).every(d => d.status === 'done'))
      .sort((a, b) => a.order - b.order);
    while (activeCount < 4 && ready.length) {
      launch(ready.shift(), withFail);
    }
    if (activeCount === 0) {
      const pendingLeft = vis.some(n => n.status === 'pending');
      if (!pendingLeft) {
        state.running = false;
        const failLeft = vis.some(n => n.status === 'failed' || n.status === 'blocked');
        state.activity = failLeft ? '已停止：存在失败/暂缓项，可单独重试' : '';
        updateControls(); updateStrip(); return;
      }
      cascadeBlock();
    }
    setTimeout(tick, 220);
  };
  tick();
}

function launch(n, withFail) {
  activeCount++;
  n.status = 'running'; n.pct = 0;
  state.activity = `正在生成：${n.shot ? `镜 ${n.shot} · ` : ''}${TYPES[n.type].label}`;
  refreshNode(n);
  maybeFollow(n);
  const dur = 650 + Math.random() * 1350;
  const failSet = withFail ? failIds() : null;
  const settle = (status, prefix) => {
    activeCount--;
    clearInterval(iv);
    n.status = status; n.pct = 0;
    state.activity = `${prefix}：${n.shot ? `镜 ${n.shot} · ` : ''}${TYPES[n.type].label}`;
    refreshNode(n);
    if (status === 'done') releaseBlocked();
  };
  const iv = setInterval(() => {
    n.pct = Math.min(100, n.pct + 100 / (dur / 110));
    if (failSet && failSet.has(n.id) && n.pct >= 68) { settle('failed', '生成失败'); return; }
    if (n.pct >= 100) { settle('done', '已完成'); return; }
    const veil = document.querySelector(`[data-id="${n.id}"] .veil span`);
    const prog = document.querySelector(`[data-id="${n.id}"] .prog`);
    if (veil) veil.textContent = `生成中 ${Math.floor(n.pct)}%`;
    if (prog) prog.style.width = `${n.pct}%`;
  }, 110);
  timers.push(iv);
}

function failIds() {
  const set = new Set();
  const vis = visible();
  const kf = vis.find(n => n.type === 'keyframe' && n.shot === Math.min(2, state.shotCount));
  const vd = vis.find(n => n.type === 'video' && n.shot === Math.min(5, state.shotCount));
  if (kf) set.add(kf.id);
  if (vd) set.add(vd.id);
  return set;
}

function maybeFollow(n) {
  if (!state.follow) return;
  const el = document.querySelector(`[data-id="${n.id}"]`);
  if (el) {
    const r = el.getBoundingClientRect();
    if (r.bottom > innerHeight - 60 || r.top < 0) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function markAll(status) {
  stopTimers();
  state.running = false;
  activeCount = 0;
  state.nodes.forEach(n => { n.status = status; n.pct = 0; });
  state.activity = '';
  updateControls();
  render();
}

function updateControls() {
  document.getElementById('btnRun').disabled = state.running;
  document.getElementById('btnAll').disabled = state.running;
  document.getElementById('btnFail').disabled = state.running;
  document.getElementById('btnRun').textContent = state.running ? '⏳ 生成中…' : '▶ 模拟生成';
}

/* ================= 事件 ================= */
document.getElementById('btnRun').onclick = () => startRun(false);
document.getElementById('btnAll').onclick = () => markAll('done');
document.getElementById('btnReset').onclick = () => markAll('pending');
document.getElementById('btnFail').onclick = () => { markAllSilent(); startRun(true); };
function markAllSilent() { stopTimers(); state.running = false; state.nodes.forEach(n => { n.status = 'pending'; n.pct = 0; }); }
document.getElementById('btnFollow').onclick = function () {
  state.follow = !state.follow;
  this.textContent = state.follow ? '跟随滚动 ✓' : '跟随滚动 ✕';
  this.style.opacity = state.follow ? 1 : .6;
};
document.getElementById('selShots').onchange = function () {
  state.shotCount = Number(this.value);
  buildProject();
  state.nodes.forEach(n => n.status = 'done');
  render();
};
document.getElementById('selDensity').onchange = function () {
  document.documentElement.style.setProperty('--card-min', this.value + 'px');
};
document.getElementById('btnTypes').onclick = function (e) {
  e.stopPropagation();
  document.getElementById('typePop').classList.toggle('open');
};
document.addEventListener('click', e => {
  const pop = document.getElementById('typePop');
  if (pop.classList.contains('open') && !pop.contains(e.target) && e.target.id !== 'btnTypes') pop.classList.remove('open');
});

function renderTypePop() {
  const counts = {};
  state.nodes.forEach(n => counts[n.type] = (counts[n.type] || 0) + 1);
  let html = '<h4>勾选 = 在画布上展示（对应节点类型）</h4>';
  let lastStage = '';
  for (const t of TYPE_ORDER) {
    const def = TYPES[t];
    if (def.stage !== lastStage) { html += (lastStage ? '<div class="sep"></div>' : ''); lastStage = def.stage; }
    const on = state.enabled.has(t);
    const stageName = STAGES.find(s => s.id === def.stage).name;
    html += `<label class="${on ? '' : 'off'}">
      <input type="checkbox" data-type="${t}" ${on ? 'checked' : ''}>
      <span>${def.label}${def.aux ? ' ·默认折叠' : ''}</span>
      <small>${def.tool} · ${counts[t] || 0}</small>
    </label>`;
  }
  document.getElementById('typePop').innerHTML = html;
  document.querySelectorAll('#typePop input').forEach(cb => {
    cb.onchange = () => {
      const t = cb.dataset.type;
      cb.checked ? state.enabled.add(t) : state.enabled.delete(t);
      renderTypePop(); render();
    };
  });
}

document.getElementById('stream').addEventListener('click', e => {
  const retryBtn = e.target.closest('[data-retry]');
  if (retryBtn) {
    const n = nodeById(retryBtn.dataset.retry);
    n.status = 'pending'; n.pct = 0;
    refreshNode(n);
    if (!state.running) startRun(false);
    return;
  }
  const card = e.target.closest('.node.done');
  if (card && (card.classList.contains('image') || card.classList.contains('video'))) {
    const n = nodeById(card.dataset.id);
    if (!n) return;
    const lb = document.getElementById('lb');
    const img = document.getElementById('lbImg');
    img.src = n.img; img.style.filter = n.hue ? `hue-rotate(${n.hue}deg)` : '';
    document.getElementById('lbCap').innerHTML =
      `${esc(n.title)}${n.kind === 'video' ? ` · ${n.dur}` : ''}<small>${n.kind === 'video' ? '视频预览（原型为静态模拟，实际接入 VideoPlayerModal）' : '图片预览（实际接入 ImageZoomModal）'}</small>`;
    lb.classList.add('open');
  }
});
document.getElementById('lb').onclick = () => document.getElementById('lb').classList.remove('open');
document.getElementById('stageChips').addEventListener('click', e => {
  const chip = e.target.closest('[data-goto]');
  if (chip) document.getElementById(chip.dataset.goto)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ================= 启动：默认展示 6 镜全部完成的目标形态 ================= */
buildProject();
state.nodes.forEach(n => n.status = 'done');
renderTypePop();
render();
updateControls();
</script>
</body>
</html>
