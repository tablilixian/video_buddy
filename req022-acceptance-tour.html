<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REQ-022 拍摄定稿 · 全流程验收导览</title>
<style>
:root{
  --bg:#121210; --panel:#1b1b19; --panel2:#222220; --line:#33322e; --line2:#3d3c37;
  --ink:#e9e9e6; --muted:#b0aea6; --faint:#7c7a72; --accent:#e0b464; --accent2:#c99a45;
  --ok:#8fbf6a; --warn:#e0a34a; --bad:#e07a6a; --blue:#6fa8dc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
a{color:var(--accent)}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
h1,h2,h3,h4{margin:0;font-weight:500}

/* ── 布局 ── */
.wrap{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav.rail{border-right:1px solid var(--line);background:#161614;padding:16px 12px 32px;position:sticky;top:0;height:100vh;overflow:auto}
nav.rail h1{font-size:14px;margin-bottom:2px}
nav.rail .sub{color:var(--faint);font-size:11.5px;margin-bottom:14px}
.step{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.step:hover{background:#1e1e1c}
.step.on{background:#26241d;border-color:#4a4128}
.step .n{flex:0 0 18px;height:18px;border-radius:50%;border:1px solid var(--line2);font-size:10.5px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-top:1px}
.step.on .n{border-color:var(--accent);color:var(--accent)}
.step.done .n{border-color:var(--ok);color:var(--ok);background:#1d2419}
.step .t{font-size:12.5px;line-height:1.4}
.step .p{font-size:10.5px;color:var(--faint)}
.progress{margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:11.5px;color:var(--muted)}
.progress b{color:var(--accent);font-weight:500}
.bar{height:5px;border-radius:99px;background:#2a2a27;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

main{padding:22px 26px 80px;max-width:1420px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.head h2{font-size:18px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);font-size:11.5px;color:var(--muted)}
.tag.ok{border-color:#3f5c2c;color:var(--ok)}
.tag.warn{border-color:#5c4a24;color:var(--warn)}
.tag.bad{border-color:#5c3530;color:var(--bad)}
.tag.acc{border-color:#5c4a24;color:var(--accent)}
.lede{color:var(--muted);font-size:13px;margin:8px 0 16px;max-width:980px}

.cols{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(300px,.68fr);gap:18px;align-items:start}
@media (max-width:1150px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px}
.card h3{font-size:13px;color:var(--accent);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.card + .card{margin-top:14px}
ul.plain{margin:6px 0;padding-left:18px}
ul.plain li{margin:5px 0}
.check{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:#1d1d1b}
.check:hover{border-color:var(--line2)}
.check input{margin-top:3px;accent-color:var(--accent)}
.check span{font-size:12.5px}
.check.ck{border-color:#3f5c2c;background:#1c231a}
.nay li{color:#d8a79c}
.nay{list-style:none;padding-left:0}
.nay li::before{content:"✕ ";color:var(--bad)}

/* ── App 模拟 ── */
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0f0f0e;position:relative}
.mock .titlebar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#1a1a18;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#e0655a}.dots i:nth-child(2){background:#e0b464}.dots i:nth-child(3){background:#8fbf6a}
.mock .app{display:grid;grid-template-columns:150px minmax(0,1fr) 240px;height:392px}
@media (max-width:900px){.mock .app{grid-template-columns:120px minmax(0,1fr) 0}}
.rail2{border-right:1px solid var(--line);background:#151513;padding:8px;font-size:11px;overflow:hidden}
.rail2 .h{color:var(--faint);font-size:10px;margin:8px 0 5px;letter-spacing:.04em}
.pitem{padding:5px 6px;border-radius:6px;margin-bottom:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem.on{background:#26241d;color:var(--ink);border:1px solid #4a4128}
.center{display:flex;flex-direction:column;min-width:0;position:relative;background:#121211}
.tools{display:flex;gap:8px;align-items:center;padding:5px 9px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--faint)}
.tools .grow{flex:1}
.wf{display:flex;gap:5px;align-items:center;padding:5px 9px;border-bottom:1px solid var(--line);font-size:10.5px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:99px;padding:1px 7px;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip.stage{border-color:transparent;color:var(--faint)}
.chip.stage.done{color:var(--ok)}
.chip.stage.now{color:var(--accent);border-color:#4a4128}
.chip.sb{margin-left:auto;border-color:#5c4a24;color:var(--accent);cursor:pointer}
.chip.sb:hover{background:#26241d}
.canvas{position:relative;flex:1;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#2a2a27 1px,transparent 0) 0 0/16px 16px,#121211}
.node{position:absolute;border:1px solid var(--line2);border-radius:8px;background:#1c1c1a;font-size:10px;color:var(--muted);overflow:hidden}
.node .nt{padding:4px 6px;border-bottom:1px solid var(--line);color:var(--ink);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nb{padding:5px 6px;line-height:1.5;white-space:pre-wrap}
.node.anchor{border-color:#5c4a24}
.node.shot{border-color:#3d4a2c}
.node.char{border-color:#3a4a5c}
.node img,.node .ph{width:100%;height:62px;background:linear-gradient(135deg,#232a3a,#2f2a22);display:block}
.node .gen{position:absolute;inset:auto 0 0 0;background:#000000aa;color:var(--accent);font-size:9.5px;padding:2px 6px;text-align:right}
.chat{border-left:1px solid var(--line);background:#151513;padding:8px;font-size:11px;overflow:hidden;display:flex;flex-direction:column}
.chat .who{color:var(--faint);font-size:10px;margin:6px 0 3px}
.bub{background:#1e1e1c;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--muted);white-space:pre-wrap;line-height:1.5}
.bub.you{background:#22201a;border-color:#3d3728}
.toolrow{display:flex;align-items:center;gap:6px;background:#1a1a18;border:1px solid var(--line);border-radius:8px;padding:4px 7px;color:var(--muted);font-size:10.5px}
.toolrow i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
.toolrow.run i{background:var(--accent)}
.chat .sp{flex:1}
/* 覆盖层 */
.overlay{position:absolute;inset:0;background:#101010f2;display:flex;flex-direction:column;z-index:9}
.overlay .oh{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11.5px}
.overlay .oh .sp{flex:1}
.btn{border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:99px;padding:2px 11px;font-size:11px;cursor:pointer}
.btn:hover{border-color:var(--line2);background:#222}
.btn.primary{border-color:#5c4a24;background:#26241d;color:var(--accent)}
.btn.primary:hover{background:#302c20}
.overlay .ob{flex:1;overflow:auto;padding:10px 14px;font-size:11px}
.sbtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.sbidx{border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--faint);font-size:10px}
.sbsec{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:7px;background:#161614}
.sbsec h4{font-size:11.5px;color:var(--accent);margin-bottom:4px}
.sbsec p,.sbsec li{color:var(--muted);margin:2px 0}
.kv{display:grid;grid-template-columns:56px 1fr;gap:2px 8px;color:var(--muted)}
/* 模态 */
.modal{position:absolute;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:10}
.modal .box{width:min(430px,86%);background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
.modal h4{font-size:13px;margin-bottom:8px;color:var(--warn)}
.modal h4.ok{color:var(--ok)}
.modal ul{margin:6px 0 10px;padding-left:18px;color:var(--muted);font-size:12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
.hint{color:var(--accent);font-size:11.5px;margin-top:8px}
.callout{border-left:3px solid var(--accent);background:#1d1c18;padding:8px 11px;border-radius:0 8px 8px 0;color:var(--muted);font-size:12.5px;margin:8px 0}
.callout.bad{border-left-color:var(--bad);background:#1e1a19}
.callout.ok{border-left-color:var(--ok);background:#1a1e18}
kbd{border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--muted);background:#1c1c1a}
.foot{color:var(--faint);font-size:11.5px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
.dim{color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail">
    <h1>REQ-022 拍摄定稿</h1>
    <div class="sub">全流程验收导览 · v2<br>阶段一（拍摄定稿）会<b style="color:var(--accent)">自动打开</b>故事板<br>点阶段切换 · 用 ← → 也能走</div>
    <div id="steps"></div>
    <div class="progress">
      验收点勾选进度<br><b id="cnt">0 / 0</b>
      <div class="bar"><i id="pbar"></i></div>
    </div>
  </nav>
  <main>
    <div class="head">
      <h2 id="title"></h2>
      <span class="tag acc" id="stateTag"></span>
      <span class="tag" id="phaseTag"></span>
    </div>
    <p class="lede" id="lede"></p>
    <div class="cols">
      <div>
        <div class="card" style="padding:0;overflow:hidden">
          <div class="mock" id="mock"></div>
        </div>
        <div class="card" id="tipCard" style="margin-top:12px"></div>
      </div>
      <div>
        <div class="card"><h3>你应该看到</h3><ul class="plain" id="see"></ul></div>
        <div class="card"><h3>验收点（点一下打勾）</h3><div id="checks"></div></div>
        <div class="card"><h3>不该看到（反例）</h3><ul class="nay" id="nay"></ul></div>
      </div>
    </div>
    <div class="foot">
      本页是<b>示意</b>，不是真实生成产物 —— 界面骨架与文案对拍当前实现，数据为示例。
      真实验收步骤见每屏「验收点」。改动来自 REQ-022（CV-293 增量批 + CV-295 原子批）。
    </div>
  </main>
</div>
<script>
/* ══════════════ 小工具 ══════════════ */
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 画布节点：x/y/w/h 基于 460×300 的示意坐标 */
function node(n){
  const cls = n.kind === 'anchor' ? 'anchor' : n.kind === 'shot' ? 'shot' : n.kind === 'char' ? 'char' : '';
  const ph = n.kind === 'char' ? '<div class="ph"></div>' : '';
  const gen = n.gen ? `<div class="gen">${esc(n.gen)}</div>` : '';
  return `<div class="node ${cls}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;min-height:${n.h||0}px">
    <div class="nt">${esc(n.title)}</div>${ph}
    ${n.body ? `<div class="nb">${esc(n.body)}</div>` : ''}${gen}
  </div>`;
}

/* ══════════════ App 模拟渲染 ══════════════ */
function mock(cfg){
  const stages = ['剧本','分镜','定妆','关键帧','镜头','成片'];
  const cur = cfg.stageIndex ?? 0;
  const stageChips = stages.map((s,i)=>{
    const cls = 'chip stage' + (i===cur?' now':(i<cur?' done':''));
    return `<span class="${cls}">${s}</span>`;
  }).join('');
  const wf = cfg.wf ?? `
    <span class="chip on">逐步确认</span><span class="chip">放手跑</span>
    ${stageChips}
    <span class="chip sb" id="sbBtn">拍摄定稿</span>
    <span class="chip" style="border-color:transparent">已产出 ${cfg.produced ?? 0} 个节点 · 阶段 ${stages[cur]}</span>`;

  const chat = (cfg.chat ?? []).map(m=>{
    if (m.tool) return `<div class="who">工具</div><div class="toolrow${m.run?' run':''}"><i></i>${esc(m.tool)}</div>`;
    if (m.who === 'you') return `<div class="who">你</div><div class="bub you">${esc(m.text)}</div>`;
    return `<div class="who">机器人</div><div class="bub">${esc(m.text)}</div>`;
  }).join('');

  const nodes = (cfg.nodes ?? []).map(node).join('');

  const overlay = cfg.overlay ? renderOverlay(cfg.overlay) : '';

  return `<div class="titlebar"><span class="dots"><i></i><i></i><i></i></span>
      <span>Canvas Studio</span><span class="sp" style="flex:1"></span><span>VideoBuddy v2.0.4 · 黄昏模式</span></div>
    <div class="app">
      <div class="rail2">
        <div class="h">创作</div>
        <div class="pitem">灵感</div><div class="pitem">技能</div><div class="pitem">资产</div>
        <div class="h">项目</div>
        ${(cfg.projects ?? ['机器人第一次接触人类','测试起名字','雨夜来信（新）']).map((p,i)=>
          `<div class="pitem${i===0?' on':''}">${esc(p)}</div>`).join('')}
      </div>
      <div class="center">
        <div class="tools"><span>上传文件</span><span>100%</span><span class="grow"></span><span>⤢ ⛶ ⌘</span></div>
        <div class="wf">${wf}</div>
        <div class="canvas">${nodes}</div>
        ${overlay}
      </div>
      <div class="chat">
        <div class="who">机器人首次接触人类视频　·　<b style="color:var(--muted)">拍摄定稿</b></div>
        ${chat}
        <div class="sp"></div>
        <div class="bub" style="opacity:.5">给智能体发消息…</div>
      </div>
    </div>`;
}

/* 覆盖层：placeholder（无故事板）/ storyboard（有故事板）/ landing（落地模态） */
function renderOverlay(kind){
  const head = (right) => `<div class="oh"><span>拍摄定稿</span><span class="sp"></span>${right}</div>`;
  if (kind === 'placeholder'){
    return `<div class="overlay">${head('<button class="btn" onclick="closeOverlay()">关闭</button>')}
      <div class="ob" style="display:flex;align-items:center;justify-content:center;text-align:center">
        <div><div style="font-size:13px;margin-bottom:6px">还没有拍摄定稿</div>
        <div class="dim">这个项目还没有产出故事板。等 agent 完成「拍摄定稿」阶段后，这里会展示分镜脚本、角色设定、声音设计等全片总览。</div></div>
      </div></div>`;
  }
  const sections = [
    ['00 创意理解','民国雨夜，一封迟到了三十年的信从门缝里塞进来。'],
    ['01 素材与事实','· 石库门天井进深 4–6 米（已核实）　· 火漆封口用色（待核实 → 不落画布）'],
    ['02 视觉规范','色彩 青灰冷调 + 钨丝暖点　光线 单一实用光源　节奏 文戏 2.5s/拍'],
    ['03 旁白设计','V1 那封信来得比雨更冷。3.2s　→ 引用 S1-Sh1'],
    ['04 分镜脚本','S1 雨夜投信：S1-Sh1（2.5s Push in）／S1-Sh2（2.0s Static，备份）'],
    ['05 角色设定','C1 苏婉 · 静但不是弱 · lockedPrompt 已冻结'],
    ['06 声音设计','BPM 52 · −16 LUFS · 侧链 1.5–3kHz 避让人声'],
    ['07 素材清单','石库门参考图（已就绪）· 雨声环境音（待上传）'],
    ['08 硬约束','一个 shot 只允许一个运镜动词／暖只来自光'],
  ];
  const body = sections.map(([t,d])=>`<div class="sbsec"><h4>${esc(t)}</h4><p>${esc(d)}</p></div>`).join('');
  const head2 = `<div class="oh"><span>拍摄定稿</span><span class="sp"></span>
      <button class="btn primary" onclick="land()">确认落地</button>
      <button class="btn" onclick="closeOverlay()">关闭</button></div>`;
  return `<div class="overlay">${head2}
    <div class="ob">
      <div class="sbtabs">${sections.map(([t])=>`<span class="sbidx">${esc(t.split(' ')[0])}</span>`).join('')}</div>
      <div class="sbsec" style="border-color:#5c4a24"><div class="kv">
        <span>总时长</span><span>8.0s</span><span>画幅</span><span>16:9</span>
        <span>分镜</span><span>2 · shot 3 · 旁白 7.2s · 角色 1 · 硬约束 2</span></div></div>
      <div class="sbsec" style="border-color:#3f5c2c"><div class="kv">
        <span>已填充</span><span><b style="color:var(--ok)">9 / 9 节</b> · 内容已齐（写入过程中这里会一格一格涨）</span></div></div>
      ${body}
    </div></div>`;
}

/* ══════════════ 阶段数据 ══════════════ */
const STAGES = [
{
  id:'create', nav:'创建项目', phase:'阶段 0 · 前置',
  state:'storyboarding', title:'① 新建项目：直接进入「拍摄定稿」',
  lede:'REQ-022 把「剧本 / 分镜」两道门并成阶段一。新建项目即 state=storyboarding，画布是空的 —— 落地之前画布上不该有任何制作产物。',
  mock:{ stageIndex:0, produced:0,
    chat:[{who:'you',text:'帮我做一个机器人第一次接触人类的视频片段'}],
    nodes:[{x:14,y:14,w:150,h:0,title:'剧本 · 创意',body:'帮我做一个机器人第一次\n接触人类的视频片段'}] },
  tip:'<h3>怎么走到这一步</h3><p>首页输入一句话 → 发送 → 自动认领项目并进 work 态。<b>不需要</b>先选「逐步确认 / 放手跑」，默认沿用设置页。</p><div class="callout">旧版本这一步之后会显示「需求沟通中」；三态化后是「拍摄定稿中」。</div>',
  see:['左栏出现新项目，名字取自你的第一句话','<b>故事板覆盖层自动打开</b>（阶段一它才是主工作面），看到的是「还没有拍摄定稿」空态','关掉覆盖层后能看到中栏画布（只有一张「创意」卡）','顶条出现「拍摄定稿」按钮，可随时再打开'],
  checks:['新建项目后状态是「拍摄定稿中」（不是「需求沟通中」）','<b>阶段一自动打开故事板</b>（不是先给一块空画布）','关掉后不会再自动弹（同一个项目只忍一次）；顶条按钮仍能手动打开','打开任意旧项目不崩、阶段轨道正常（旧三态已迁移）'],
  nay:['任何「剧本待批准 / 分镜待批准」字样','画布上出现分镜卡（落地前不该有）','关掉覆盖层后它又自己弹回来（应只自动打开一次）'],
},
{
  id:'clarify', nav:'澄清 + Look', phase:'阶段 1 · 拍摄定稿',
  state:'storyboarding', title:'② 澄清与 Look 采集：样张要能出，产线要拦住',

  see:['覆盖层仍可打开（只读回看）','点「确认落地」被拒绝并说明原因'],
  checks:['落地后再点「确认落地」被拒（单向终点）','覆盖层在 executing 下仍可打开回看','落地前改故事板：write_storyboard 重写，旧内容自动存成一版'],
  nay:['落地按钮消失导致信息不可查','默默允许整体重落（会与画布已有产物对不上）'],
},
];

/* ══════════════ 渲染与交互 ══════════════ */
let idx = 0;
let overlayKind = null;
let modalHTML = '';
let seeded = false;

function renderSteps(){
  document.getElementById('steps').innerHTML = STAGES.map((s,i)=>
    `<div class="step${i===idx?' on':''}" data-i="${i}"><span class="n">${i+1}</span>
      <span><span class="t">${esc(s.nav)}</span><br><span class="p">${esc(s.phase)}</span></span></div>`).join('');
  document.querySelectorAll('.step').forEach(el=>el.onclick=()=>go(+el.dataset.i));
}

function render(){
  const s = STAGES[idx];
  overlayKind = s.id === 'land' ? 'storyboard' : null;
  modalHTML = '';
  if (s.id !== 'seeded') seeded = false;
  document.getElementById('title').textContent = s.title;
  document.getElementById('stateTag').textContent = 'state = ' + s.state;
  document.getElementById('phaseTag').textContent = s.phase;
  document.getElementById('lede').textContent = s.lede;

  const cfg = JSON.parse(JSON.stringify(s.mock));
  if (s.id === 'seeded' && seeded) { /* 已落地：画布就是 seed 结果，无需改 */ }
  if (overlayKind) cfg.overlay = overlayKind;
  if (s.id === 'land' && seeded){ cfg.overlay = null; cfg.produced = 6; cfg.stageIndex = 1;
    cfg.nodes = [
      {x:10,y:8,w:132,h:0,title:'《雨夜来信》拍摄定稿 · v2',body:'【参数】8.0s · 16:9'},
      {x:152,y:8,w:96,h:0,title:'分镜 1 · S1-Sh1 · Push in'},
      {x:254,y:8,w:96,h:0,title:'分镜 2 · S1-Sh2 · Static'}]; }
  document.getElementById('mock').innerHTML = mock(cfg) + (modalHTML ? `<div class="modal">${modalHTML}</div>` : '');

  document.getElementById('see').innerHTML = s.see.map(t=>`<li>${t}</li>`).join('');
  document.getElementById('nay').innerHTML = s.nay.map(t=>`<li>${t}</li>`).join('');
  const box = document.getElementById('checks');
  const saved = getChecks();
  box.innerHTML = s.checks.map((t,i)=>{
    const id = s.id + '#' + i, on = saved.has(id);
    return `<label class="check${on?' ck':''}" data-id="${id}"><input type="checkbox" ${on?'checked':''}><span>${t}</span></label>`;
  }).join('');
  box.querySelectorAll('.check').forEach(el=>{
    el.querySelector('input').onchange = (e)=>{
      const set = getChecks();
      e.target.checked ? set.add(el.dataset.id) : set.delete(el.dataset.id);
      localStorage.setItem('req022checks', JSON.stringify([...set]));
      el.classList.toggle('ck', e.target.checked); updateProgress();
    };
  });

  let tip = s.tip;
  if (s.actions) tip = (s.actions.map(a=>`<div style="margin:6px 0"><button class="btn primary" onclick='${a.run}'>${esc(a.label)}</button></div>`).join('')) + tip;
  document.getElementById('tipCard').innerHTML = tip;

  renderSteps(); updateProgress();
}

function getChecks(){ try { return new Set(JSON.parse(localStorage.getItem('req022checks')||'[]')) } catch { return new Set() } }
function updateProgress(){
  const total = STAGES.reduce((n,s)=>n+s.checks.length,0);
  const n = getChecks().size;
  document.getElementById('cnt').textContent = n + ' / ' + total;
  document.getElementById('pbar').style.width = (total ? (n/total*100) : 0) + '%';
}
function go(i){ idx = Math.max(0, Math.min(STAGES.length-1, i)); render(); window.scrollTo({top:0,behavior:'smooth'}) }

/* 覆盖层交互 */
function openSb(kind){ overlayKind = kind; rerenderMock(); }
function closeOverlay(){ overlayKind = null; rerenderMock(); }
function rerenderMock(){
  const s = STAGES[idx];
  const cfg = JSON.parse(JSON.stringify(s.mock));
  cfg.overlay = overlayKind;
  document.getElementById('mock').innerHTML = mock(cfg) + (modalHTML ? `<div class="modal">${modalHTML}</div>` : '');
}

/* 落地流程模拟：缺项 → 补齐 → 确认 → 成功 */
let landStep = 0;
function land(){
  if (seeded){ modalHTML = modal('ok','本项目已落地（v2）','REQ-022 的落地是单向终点：整体重落被禁止。要改结构请走结构修订通道（属 P2，尚未上线）。','知道了','closeModal()'); rerenderMock(); return }
  if (landStep === 0){
    modalHTML = modal('warn','还不能落地：有 2 项没补齐',
      '<ul><li>§02 视觉规范至少需要 1 个 token（否则 Look 卡无内容）</li><li>角色 ROLE A 缺少锁定提示词（gen.lockedPrompt）</li></ul>' +
      '<div class="dim" style="font-size:11.5px">按钮不是灰的 —— 点了才告诉你缺什么、在哪一节。</div>',
      '一键补齐（示意）','landStep=1;land()', '先不落','closeModal()');
    rerenderMock(); return;
  }
  if (landStep === 1){
    modalHTML = modal('ok','确认落地',
      '<ul><li>冻结角色卡 ×1（lockedPrompt 已就绪）</li><li>分镜 2 × shot 3（上限 15 内）</li><li>硬约束 2 条将注入生成纪律</li><li>旁白 2 句 7.2s</li><li>待核实事实 1 条、待上传素材 1 条 → <b>不落画布</b></li></ul>',
      '确认落地','landStep=2;land()', '取消','closeModal()');
    rerenderMock(); return;
  }
  seeded = true; landStep = 0; overlayKind = null;
  modalHTML = modal('ok','已落地 v2','画布一次性出现 6 个节点：锚点文档、分镜卡 ×3、角色占位卡 ×1、旁白与声音节点 ×1。状态已推到 executing。','看画布','closeModal()');
  rerenderMock();
}
function modal(kind,title,body,okLabel,okRun,cancelLabel,cancelRun){
  return `<div class="box"><h4 class="${kind==='ok'?'ok':''}">${esc(title)}</h4><div style="color:var(--muted)">${body}</div>
    <div class="acts" style="margin-top:12px">
      ${cancelLabel?`<button class="btn" onclick='${cancelRun}'>${esc(cancelLabel)}</button>`:''}
      <button class="btn primary" onclick='${okRun}'>${esc(okLabel)}</button></div></div>`;
}
function closeModal(){ modalHTML=''; rerenderMock(); }

document.addEventListener('keydown', (e)=>{
  if (e.key === 'ArrowRight') go(idx+1);
  if (e.key === 'ArrowLeft') go(idx-1);
});

render();
</script>
</body>
</html>
