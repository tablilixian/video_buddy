# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    - id: canvas-studio
      name: canvas-studio
    - id: web-search-tinyfish
      name: dsh-web-search-tinyfish
      config:
        apiKeyEnv: TINYFISH_API_KEY
    # 2026-10-21: disabled — dsh-free-search@0.4.28 still imports the removed
    # 0.1.x `SettingsProvider` export from dsh-settings@0.2.1, so the hybrid
    # entry fails to import and takes the whole shell down. Re-enable after
    # upgrading dsh-free-search to a 0.2.x-compatible release.
    - id: web-search-hybrid
      name: dsh-web-search-hybrid
      disabled: true
      config:
        apiKeyEnv: TINYFISH_API_KEY
        bingMarket: zh-CN
# Canvas Studio owns the whole surface: the StudioFrame replaces the upstream
# default DSH client page. The upstream ui-layout row is disabled so the studio
# frame owns the root seat, and canvas-studio provides the ctx.layout service
# (an ILayout face) it expects. The upstream sidebar is removed: the studio
# frame does not render the sidebar brand seat, and the sidebar client statically
# depends on the ui-layout package — keeping it would fail the client loader.
# The conversation chat seat is KEPT: StudioFrame renders the official
# conversation slot on the right, so the chat stays usable inside the canvas.
- id: ui-layout
  disabled: true
- id: ui-sidebar
  disabled: true

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# 2026-10-21: back on the base bundle's defaults (deepseek-official search /
# keyless HTTP fetch) while web-search-hybrid is disabled — the `hybrid`
# provider names would resolve against an entry that no longer mounts.
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http

# Enable the web_fetch tool (base bundle ships it disabled, deferring SSRF protection).
- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000

# 2026-10-22: the two entries below never activate in this shell, and their
# mere presence blocks EVERY profile-patch write (settings user-layer writes go
# through ConfigEditor.reconcile, whose post-recompose check fails on ANY
# inactive entry — `fatal load failure: dsh: warning: 2 entries did not
# activate`). Disable them at the patch layer:
#  - hmr demands `--expose-internals`, which the Electron main process never
#    carries (upstream hands it to the host child process); desktop dev rebuilds
#    explicitly and does not use host HMR.
#  - desktop-product-telemetry reads `DSH_CLIENT_VERSION` from the shell env
#    (unset here) and would report to the upstream DeepSeek OTel collector —
#    VideoBuddy ships neither.
- id: hmr
  disabled: true
- id: desktop-product-telemetry
  disabled: true

# ── the Canvas Studio agent preset ───────────────────────────────────────────
#
# 0.2.1 moved the whole agent plane behind presets: `dsh-web-app` disables the
# host `tool-fs` / `skill-filesystem` / `tool-skill` rows and every session
# mounts one preset instead. Desktop pointed the registry at the upstream
# `minimal` preset, which ships WITHOUT a skill catalog, without the `skill`
# loader and with `read` switched off — so a Studio session could not see any
# skill at all (the model fell back to `find`/`grep` over the filesystem) and
# `minimal`'s `persona complete: true` replaced every prompt section
# canvas-studio registers, including its skill-routing directive.
#
# This preset is the product composition: `minimal`'s runtime (persistent shell
# + compaction, unchanged so the Windows pwsh path keeps its upstream shape)
# plus the three pieces Canvas Studio assumes — `read` for a skill's
# `references/` (progressive disclosure), the filesystem skill provider, and
# the `skill` loader together with its catalog. It deliberately mounts NO
# `persona`: canvas-studio owns the Studio prompt sections, and a `complete`
# persona would replace them again.
#
# `name` is set on purpose: the client classifies a named preset as custom, so
# the Coding Tools switch neither hides it nor reconciles it back to `standard`.
#
# It is declared here rather than in a second `presets/*.patch.yml` because the
# launcher materializes its profile layer from THIS file alone
# (`materializeDesktopLayer` copies `cordis.patch.yml` verbatim and appends only
# the computed rows) — a separate patch file would apply to the persisted
# profile but not to the launcher's own view, and those two compositions must
# stay identical.
- insert:
    - id: preset-canvas
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: canvas
        name: Canvas Studio
        description: >-
          Video production agent for Canvas Studio: the Studio prompt sections,
          its skill catalog and loader, read-only filesystem access for skill
          references, and a persistent shell.
        order: 0
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a bash shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
                    * State is persistent across command calls and discussions with the user.
                    * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000
              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a PowerShell shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * You don't have access to the internet via this tool.
                    * State is persistent across command calls and discussions with the user.
                    * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.
