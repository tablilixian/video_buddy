<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>canvas-surface-probe</title>
<style>html, body { margin: 0; padding: 0; }</style>
</head>
<body>
<div id="root"></div>
<script>
// 探针页自身的错误必须显式落盘（否则 driver 只会看到「没跑完」）。
window.__probeErrors = []
window.onerror = function (msg, src, line, col) {
  window.__probeErrors.push('WINDOW_ERROR: ' + msg + ' @' + line + ':' + col)
  document.title = 'PROBE_ERROR'
  return false
}
window.addEventListener('unhandledrejection', function (e) {
  window.__probeErrors.push('REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)))
})
</script>
<script src="probe.iife.js"></script>
</body>
</html>
