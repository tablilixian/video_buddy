# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    - id: canvas-studio
      name: canvas-studio
    - id: web-search-tinyfish
      name: dsh-web-search-tinyfish
      config:
        apiKeyEnv: TINYFISH_API_KEY
    - id: web-search-hybrid
      name: dsh-web-search-hybrid
      config:
        apiKeyEnv: TINYFISH_API_KEY
        bingMarket: zh-CN
    - id: memos-local-memory
      name: '@memtensor/memos-local-plugin/dist/adapters/deepseek-harness/index.js'
      config:
        enabled: true
        profileId: default
        home: ''
        recallEnabled: true
        captureEnabled: true
        toolsEnabled: true
        hostLlmEnabled: true
        viewerEnabled: false
        viewerPort: 18801
        recallTimeoutMs: 3000
        contextMaxChars: 6000
        toolResultMaxChars: 1200
        failOnStartupError: false

# Canvas Studio owns the whole surface: the StudioFrame replaces the upstream
# default DSH client page. The upstream ui-layout row is disabled so the studio
# frame owns the root seat, and canvas-studio provides the ctx.layout service
# (an ILayout face) it expects. The upstream sidebar is removed: the studio
# frame does not render the sidebar brand seat, and the sidebar client statically
# depends on the ui-layout package — keeping it would fail the client loader.
# The conversation chat seat is KEPT: StudioFrame renders the official
# conversation slot on the right, so the chat stays usable inside the canvas.
- id: ui-layout
  disabled: true
- id: ui-sidebar
  disabled: true

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# Route the web seam's search and fetch to the hybrid provider so a fresh
# install works without any API key: search runs the keyless free-engine chain
# (Bing zh-CN → DDG lite → DDG html, from dsh-free-search) and fetch uses the
# built-in keyless HTTP retrieval. When a TINYFISH_API_KEY is stored (web
# settings page), the same provider upgrades to the TinyFish search/fetch APIs
# per call — no restart needed. Overrides the base bundle's `searchProvider`/
# `fetch` rows by id; last write wins per row. The TinyFish plugin stays
# registered above for its settings surface and provides the keyed backend;
# dsh-free-search is a library dependency of the hybrid plugin, so its engine
# functions are reused without a standalone provider row.
- id: web
  config:
    searchProvider: hybrid
    fetchProvider: hybrid

# Enable the web_fetch tool (base bundle ships it disabled, deferring SSRF protection).
- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 60000
