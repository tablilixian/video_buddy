      if (v && shotNo[v.id] != null) shotNo[n.id] = shotNo[v.id];

      if (shots.length) shotNo[n.id] = Math.min(...shots);

    const dash = (n.sup || n.up) ? `stroke-dasharray="4 3"` : '';
    const h = n.sup ? CHIP_H : NH;
    let inner = `<rect class="nrect" width="${NW}" height="${h}" rx="${n.sup ? 6 : 8}" fill="#161b22" stroke="${c}" ${dash}/>`;
    if (n.asset && !n.sup && (n.kind === 'image' || n.kind === 'video')) {
      inner += `<clipPath id="${clipId(n.id)}"><rect x="1" y="20" width="${NW-2}" height="${NH-26}" rx="4"/></clipPath>`;
      inner += `<image href="${ASSET_BASE}${n.asset}" x="1" y="20" width="${NW-2}" height="${NH-26}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${clipId(n.id)})" opacity="${n.kind === 'video' ? '.7' : '.92'}"/>`;
    }
    inner += `<rect width="${NW}" height="18" rx="8" fill="${c}22"/>`;
    const title = n.title.length > 12 ? n.title.slice(0, 12) + '…' : n.title;
    inner += `<text class="ntext" x="6" y="13" fill="${c}">${title}</text>`;
    if (n.v) inner += `<text class="nsub" x="${NW-6}" y="13" text-anchor="end" fill="#f0883e">v${n.v}</text>`;
    const sub = [];
    if (n.sup) sub.push('已取代 → ' + (byId[n.sup] ? byId[n.sup].title.slice(0, 8) : ''));
    if (n.up) sub.push('用户上传 · 假数据');
    if (n.kind === 'group') sub.push(`托盘 ×${(n.members || []).length}`);
    if (n.tool === 'extract_last_frame') sub.push('末帧桥接');
    if (!n.refs || !n.refs.length) { if (n.kind !== 'group' && !n.sup) sub.push('无血缘'); }
    const imgTop = (n.asset && !n.sup && (n.kind === 'image' || n.kind === 'video')) ? NH - 10 : (n.sup ? 17 : NH - 8);
    if (sub.length) inner += `<text class="nsub" x="6" y="${imgTop}">${sub.join(' · ')}</text>`;
    if (!n.asset && !n.sup) inner += `<text class="ntext" x="${NW/2}" y="${NH/2 + 12}" text-anchor="middle" opacity=".4">${KIND_NAME[n.kind]}</text>`;
    g.innerHTML = inner;
    g.dataset.id = n.id;
    world.appendChild(g);
  });

  // 统计
  const drawn = EDGES.filter(e => !bundled.has(e.src)).length;
  document.getElementById('stat').innerHTML = view === 'opt'
    ? `节点 <b>${DATA.length}</b> · 边 <b>${EDGES.length}</b> · 泳道行 <b>${opt.shots.length}</b> 镜 · 绘制边 <b>${drawn}</b>（束化 <b>${EDGES.length - drawn}</b>） · 最大列高 <b>${Math.round(opt.bounds.maxY)}</b>px`
    : `节点 <b>${DATA.length}</b> · 边 <b>${EDGES.length}</b> · 原始坐标`;
  bindHover();
}

function bindHover() {
  svg.querySelectorAll('.node-g').forEach(g => {
    g.addEventListener('mouseenter', () => {
      const id = g.dataset.id;
      svg.querySelectorAll('.edge').forEach(p => p.classList.toggle('lit', p.dataset.src === id || p.dataset.dst === id));
      svg.querySelectorAll('.bundle').forEach(p => { if (p.dataset.src === id) expandBundle(id); });
    });
    g.addEventListener('mouseleave', () => { collapseBundles(); });
  });
}
function expandBundle(src) {
  svg.querySelectorAll(`.edge.bundle[data-src="${src}"]`).forEach(p => p.style.display = 'none');
  EDGES.filter(e => e.src === src).forEach(e => {
    const d = edgePath(e.src, e.dst); if (!d) return;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d); p.setAttribute('class', 'edge lit'); p.dataset.tmp = '1';
    svg.querySelector('#world').appendChild(p);
  });
}
function collapseBundles() {
  svg.querySelectorAll('.edge[data-tmp]').forEach(p => p.remove());
  svg.querySelectorAll('.edge.bundle').forEach(p => { p.style.display = ''; });
}

const wrap = document.getElementById('wrap');
let drag = null;
wrap.addEventListener('mousedown', e => { drag = { x:e.clientX, y:e.clientY, px:panX, py:panY }; });
window.addEventListener('mousemove', e => { if (!drag) return; panX = drag.px + e.clientX - drag.x; panY = drag.py + e.clientY - drag.y; applyT(); });
window.addEventListener('mouseup', () => drag = null);
wrap.addEventListener('wheel', e => { e.preventDefault(); scale = Math.min(2, Math.max(0.06, scale * (e.deltaY > 0 ? 0.9 : 1.1))); applyT(); }, { passive:false });
function applyT() { const w = document.getElementById('world'); if (w) w.setAttribute('transform', `translate(${panX},${panY}) scale(${scale})`); }
function fit() {
  let maxX, maxY;
  if (view === 'opt' && opt) { maxX = opt.bounds.maxX; maxY = opt.bounds.maxY; }
  else { maxX = Math.max(...DATA.map(n => n.x)) + NW + 40; maxY = Math.max(...DATA.map(n => n.y)) + NH + 40; }
  scale = Math.min((wrap.clientWidth - 40) / maxX, (wrap.clientHeight - 40) / maxY, 1);
  panX = 20; panY = 10; applyT();
}
document.getElementById('fitBtn').onclick = fit;
document.querySelectorAll('.viewbtn[data-v]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.viewbtn[data-v]').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); view = b.dataset.v; render(); fit();
});

document.getElementById('legend').innerHTML =
  Object.entries(KIND_COLOR).map(([k, c]) => `<span><span class="dot" style="background:${c}"></span>${KIND_NAME[k]}</span>`).join('')
  + `<span><span class="dot" style="background:transparent;border:1px dashed #8b949e"></span>空血缘 / 被取代</span>`
  + `<span><span class="dot" style="background:#f0883e"></span>vN 版本号</span>`
  + `<span style="color:#6e7681">｜ 泳道：行 = 镜号，行内 卡→场景图→视频→末帧→托盘；绿边 = 末帧软衔接；&gt;3 消费者折叠为引用束</span>`;

render(); fit();
</script>
</body>
</html>
