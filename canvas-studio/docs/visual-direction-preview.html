<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canvas Studio · 视觉升维设计稿</title>
<style>
/* ==========================================================================
   Canvas Studio 视觉升维设计稿
   —— 单文件、零外部依赖、全部样式与脚本内联。

   令牌命名与工程一致（src/brand.ts + docs/visual-direction-plan.md）：
   空间三档（DD-02）/ 字阶六级（DD-01）/ 动效三语义（DD-05）
   ========================================================================== */

:root{
  /* —— 空间三档（DD-02）：壳 < 画布（最暗） < 节点 < 浮层 —— */
  --cs-shell:#15171E;
  --cs-shell-2:#1A1D26;
  --cs-shell-3:#20242F;
  --cs-canvas:#0F1117;
  --cs-canvas-1:#1A1D29;
  --cs-node:#1E2230;
  --cs-node-hi:#252A3B;
  --cs-float:#22273A;

  /* 发型线与网格 */
  --cs-line:rgba(255,255,255,.075);
  --cs-line-hi:rgba(255,255,255,.14);
  --cs-dot:rgba(255,255,255,.06);
  --cs-dot-major:rgba(255,255,255,.11);

  /* 品牌（cinema-violet 预设） */
  --cs-accent:#7C6CFF;
  --cs-accent-2:#9D8DFF;
  --cs-accent-deep:#5B4BD6;
  --cs-accent-soft:rgba(124,108,255,.14);
  --cs-gold:#E8B45A;
  --cs-teal:#35C2A6;
  --cs-danger:#E5484D;

  /* 文字三级 */
  --cs-t1:#E9EAF0;
  --cs-t2:#98A0B0;
  --cs-t3:#666E80;

  /* 选中光晕 / 景深 */
  --cs-glow:0 0 0 1px rgba(124,108,255,.55), 0 0 22px rgba(124,108,255,.26);
  --cs-dim:.42;

  /* —— 字阶六级（DD-01：收口 11 种离散值） —— */
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px;
  --fs-lg:14px; --fs-xl:18px; --fs-2xl:24px;

  /* 间距（4px 基数） */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;

  /* 圆角 */
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;

  /* 阴影 */
  --sh1:0 1px 2px rgba(0,0,0,.5);
  --sh2:0 6px 18px rgba(0,0,0,.45);
  --sh3:0 18px 48px rgba(0,0,0,.6);

  /* —— 动效三语义（DD-05） —— */
  --dur-fast:120ms; --dur:200ms; --dur-slow:320ms;
  --ease:cubic-bezier(.2,0,0,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--cs-canvas);
  color:var(--cs-t1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  font-size:var(--fs-md);
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background var(--dur) var(--ease);
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:var(--r-pill)}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
::-webkit-scrollbar-track{background:transparent}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ========================== 外壳布局 ========================== */
.app{height:100%;display:flex;flex-direction:column}

.topbar{
  flex:0 0 auto;height:48px;display:flex;align-items:center;gap:var(--sp4);
  padding:0 var(--sp4);
  background:var(--cs-shell);
  border-bottom:1px solid var(--cs-line);
  z-index:40;
}
.brand{display:flex;align-items:center;gap:var(--sp3);min-width:0}
.brandMark{width:26px;height:26px;flex:0 0 auto;border-radius:var(--r-sm);overflow:hidden}
.brandText{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brandName{font-size:var(--fs-lg);font-weight:500;letter-spacing:.01em}
.brandSub{font-size:var(--fs-xs);color:var(--cs-t3)}
.topDiv{width:1px;height:22px;background:var(--cs-line)}
.topProj{display:flex;align-items:center;gap:var(--sp2);min-width:0}
.topProjName{font-size:var(--fs-md);color:var(--cs-t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topSpacer{flex:1 1 auto}
.topCtl{display:flex;align-items:center;gap:var(--sp2)}

.sw{display:inline-flex;align-items:center;gap:var(--sp2);height:28px;padding:0 var(--sp3);
  border:1px solid var(--cs-line);border-radius:var(--r-pill);
  font-size:var(--fs-sm);color:var(--cs-t2);
  transition:all var(--dur-fast) var(--ease)}
.sw:hover{border-color:var(--cs-line-hi);color:var(--cs-t1)}
.sw[aria-pressed="true"]{background:var(--cs-accent-soft);border-color:rgba(124,108,255,.45);color:var(--cs-accent-2)}
.swDot{width:6px;height:6px;border-radius:50%;background:var(--cs-t3);transition:background var(--dur-fast)}
.sw[aria-pressed="true"] .swDot{background:var(--cs-accent)}

/* ========================== 三栏 ========================== */
.frame{flex:1 1 auto;display:grid;grid-template-columns:264px minmax(0,1fr) 460px;min-height:0}

/* ---------- 左栏 ---------- */
.rail{
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:var(--cs-shell);border-right:1px solid var(--cs-line);
}
.railHead{display:flex;align-items:center;justify-content:space-between;padding:var(--sp3) var(--sp3) var(--sp2)}
.railTitle{font-size:var(--fs-sm);font-weight:500;color:var(--cs-t2);letter-spacing:.04em}
.railAct{display:flex;gap:var(--sp1)}
.iconBtn{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r-sm);
  color:var(--cs-t3);transition:all var(--dur-fast) var(--ease)}
.iconBtn:hover{background:var(--cs-shell-3);color:var(--cs-t1)}
.railScroll{flex:1 1 auto;overflow-y:auto;padding:0 var(--sp2) var(--sp3);min-height:0}
.grp{margin-bottom:var(--sp3)}
.grpHead{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp1) var(--sp2);cursor:pointer;
  border-radius:var(--r-sm);color:var(--cs-t3);font-size:var(--fs-xs);letter-spacing:.05em}
.grpHead:hover{background:var(--cs-shell-2);color:var(--cs-t2)}
.grpCaret{transition:transform var(--dur) var(--ease)}
.grp.isCollapsed .grpCaret{transform:rotate(-90deg)}
.grp.isCollapsed .grpBody{display:none}
.grpCount{margin-left:auto;font-size:var(--fs-xs);color:var(--cs-t3)}
.proj{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2);border-radius:var(--r-md);
  cursor:pointer;border:1px solid transparent;transition:all var(--dur-fast) var(--ease)}
.proj:hover{background:var(--cs-shell-2)}
.proj.isOn{background:var(--cs-canvas-1);border-color:rgba(124,108,255,.35)}
.projCover{width:34px;height:34px;flex:0 0 auto;border-radius:var(--r-sm);overflow:hidden;background:var(--cs-shell-3)}
.projMeta{min-width:0;display:flex;flex-direction:column;gap:1px}
.projName{font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projSub{font-size:var(--fs-xs);color:var(--cs-t3)}
.railFoot{flex:0 0 auto;border-top:1px solid var(--cs-line);padding:var(--sp2)}
.userCard{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2);border-radius:var(--r-md);
  cursor:pointer;transition:background var(--dur-fast) var(--ease)}
.userCard:hover{background:var(--cs-shell-2)}
.userAva{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(140deg,#7C6CFF,#5B4BD6);color:#fff;font-size:var(--fs-sm);font-weight:500}
.userMeta{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.userName{font-size:var(--fs-md)}
.userId{font-size:var(--fs-xs);color:var(--cs-t3)}
.userBal{margin-left:auto;font-size:var(--fs-xs);color:var(--cs-gold)}

/* ---------- 中栏 ---------- */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--cs-canvas)}

/* 工具栏 */
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp1);height:40px;padding:0 var(--sp3);
  background:var(--cs-shell);border-bottom:1px solid var(--cs-line);z-index:30}
.tb{height:26px;min-width:26px;padding:0 var(--sp2);display:inline-flex;align-items:center;gap:var(--sp1);
  border-radius:var(--r-sm);color:var(--cs-t2);font-size:var(--fs-sm);
  transition:all var(--dur-fast) var(--ease)}
.tb:hover{background:var(--cs-shell-3);color:var(--cs-t1)}
.tb[aria-pressed="true"]{background:var(--cs-accent-soft);color:var(--cs-accent-2)}
.tb:disabled{opacity:.32;cursor:not-allowed}
.tb:disabled:hover{background:none;color:var(--cs-t2)}
.tbDiv{width:1px;height:18px;background:var(--cs-line);margin:0 var(--sp1)}
.tbSpacer{flex:1 1 auto}
.zoomLabel{font-size:var(--fs-xs);color:var(--cs-t3);min-width:38px;text-align:center}

/* ===================== 制作阶段轨道（DD-05） ===================== */
.workflow{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp3);padding:var(--sp2) var(--sp3);
  background:var(--cs-shell-2);border-bottom:1px solid var(--cs-line);z-index:29}
.modeSw{display:inline-flex;border:1px solid var(--cs-line);border-radius:var(--r-sm);overflow:hidden;flex:0 0 auto}
.modeSw button{padding:3px 10px;font-size:var(--fs-sm);color:var(--cs-t3);transition:all var(--dur-fast)}
.modeSw button+button{border-left:1px solid var(--cs-line)}
.modeSw button.isOn{background:var(--cs-shell-3);color:var(--cs-t1)}
.stRail{display:flex;align-items:center;gap:0;flex:1 1 auto;min-width:0;overflow:hidden}
.st{padding:0 var(--sp1)}
.node{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-pill);
  font-size:var(--fs-sm);color:var(--cs-t3);border:1px solid transparent;
  transition:all var(--dur) var(--ease);white-space:nowrap;cursor:pointer}
.node:hover{color:var(--cs-t2);border-color:var(--cs-line)}
.node.isDone{color:var(--cs-t2)}
.node.isDone .stDot{background:var(--cs-teal)}
.node.isCur{color:var(--cs-t1);background:var(--cs-accent-soft);border-color:rgba(124,108,255,.45)}
.node.isCur .stDot{background:var(--cs-accent);animation:pulse 1.6s var(--ease) infinite}
.stDot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);flex:0 0 auto}
.stLink{width:16px;height:1px;background:var(--cs-line);flex:0 0 auto}
.stLink.isDone{background:rgba(53,194,166,.5)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,108,255,.6)}50%{box-shadow:0 0 0 5px rgba(124,108,255,0)}}
.wfRight{display:flex;align-items:center;gap:var(--sp2);flex:0 0 auto}
.wfTime{font-size:var(--fs-xs);color:var(--cs-t3)}

/* 审批条 —— 场记板形态（DD-05：品牌隐喻进骨架） */
.approval{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp3);padding:var(--sp2) var(--sp3);
  background:linear-gradient(90deg,rgba(232,180,90,.10),rgba(232,180,90,.03));
  border-bottom:1px solid rgba(232,180,90,.28);border-left:3px solid var(--cs-gold);
  animation:rise var(--dur-slow) var(--ease)}
.approval.isOff{display:none}
@keyframes rise{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.clap{width:26px;height:26px;flex:0 0 auto;border-radius:var(--r-sm);background:rgba(232,180,90,.14);
  display:grid;place-items:center;color:var(--cs-gold)}
.clap.isHit{animation:clapHit 420ms var(--ease)}
@keyframes clapHit{0%{transform:rotate(0)}22%{transform:rotate(-13deg)}48%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.apvText{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.apvTitle{font-size:var(--fs-md);color:var(--cs-gold);font-weight:500}
.apvSub{font-size:var(--fs-xs);color:var(--cs-t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apvAct{margin-left:auto;display:flex;gap:var(--sp2);flex:0 0 auto}
.btn{height:28px;padding:0 var(--sp3);border-radius:var(--r-sm);font-size:var(--fs-sm);
  border:1px solid var(--cs-line);color:var(--cs-t2);transition:all var(--dur-fast) var(--ease);
  display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cs-line-hi);color:var(--cs-t1)}
.btnPri{background:var(--cs-accent);border-color:var(--cs-accent);color:#fff}
.btnPri:hover{background:var(--cs-accent-2);border-color:var(--cs-accent-2);color:#fff}
.btnGold{background:var(--cs-gold);border-color:var(--cs-gold);color:#2A1E08;font-weight:500}
.btnGold:hover{background:#F3C878;border-color:#F3C878;color:#2A1E08}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ===================== 画布 ===================== */
.canvasWrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--cs-canvas)}
.canvas{position:absolute;inset:0;cursor:grab;touch-action:none}
.canvas.isPanning{cursor:grabbing}
.grid{position:absolute;inset:-200%;background-color:var(--cs-canvas);
  background-image:radial-gradient(var(--cs-dot) 1px,transparent 1px);
  background-size:24px 24px;background-position:0 0;
  transition:background-image var(--dur) var(--ease)}
.canvasWrap.isMajor .grid{background-image:radial-gradient(var(--cs-dot-major) 1px,transparent 1px)}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:rgba(255,255,255,.20);stroke-width:1.4}
.edge.isHot{stroke:rgba(124,108,255,.8);stroke-width:1.8}

/* ===================== 节点（DD-03） ===================== */
.nd{position:absolute;border-radius:var(--r-md);background:var(--cs-node);
  border:1px solid var(--cs-line);overflow:hidden;cursor:grab;
  box-shadow:var(--sh1);display:flex;flex-direction:column;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.nd:hover{background:var(--cs-node-hi);border-color:var(--cs-line-hi)}
.nd.isSel{border-color:var(--cs-accent);box-shadow:var(--cs-glow);z-index:6}
.nd.isDrag{cursor:grabbing;z-index:7;box-shadow:var(--sh2)}
.nd.isDim{opacity:var(--cs-dim)}
.nd.isNew{animation:develop 260ms var(--ease) both}
@keyframes develop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.nd.isFilm{border-color:rgba(53,194,166,.35)}

/* 镜头条头部 */
.ndHead{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 8px;
  border-bottom:1px solid var(--cs-line);background:rgba(255,255,255,.018)}
.ndIdx{font-size:var(--fs-xs);font-weight:500;color:var(--cs-accent-2);letter-spacing:.02em}
.ndTitle{font-size:var(--fs-sm);color:var(--cs-t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.ndChip{font-size:var(--fs-xs);padding:1px 5px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.07);color:var(--cs-t3);flex:0 0 auto}
.ndChip.isShot{background:rgba(124,108,255,.14);color:var(--cs-accent-2)}

/* 媒体区（片门感：上下极窄暗带） */
.ndArt{flex:1 1 auto;position:relative;overflow:hidden;background:var(--cs-canvas);
  border-top:2px solid #0B0D12;border-bottom:2px solid #0B0D12}
.ndArt>svg{display:block;width:100%;height:100%}
.projCover svg,.clipArt svg{display:block;width:100%;height:100%}
.ndArtTxt{position:absolute;inset:0;padding:8px 9px;font-size:var(--fs-xs);line-height:1.55;
  color:var(--cs-t2);overflow:hidden}
.ndArtTxt b{color:var(--cs-t1);font-weight:500}
/* 生成中：扫描光带（DD-05 行进语义） */
.ndScan{position:absolute;inset:0;overflow:hidden;background:rgba(11,13,18,.86);display:none}
.nd.isLoading .ndScan{display:block}
.ndScanBand{position:absolute;top:-40%;left:0;right:0;height:40%;
  background:linear-gradient(180deg,transparent,rgba(124,108,255,.22),transparent);
  animation:scan 1.5s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(320%)}}
.ndScanTxt{position:absolute;left:0;right:0;bottom:10px;text-align:center;
  font-size:var(--fs-xs);color:var(--cs-accent-2)}
/* 选中时媒体外发光 */
.nd.isSel .ndArt::after{content:"";position:absolute;inset:0;
  box-shadow:inset 0 0 0 1px rgba(124,108,255,.35)}
/* 页脚元信息 */
.ndFoot{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp2);padding:4px 8px;
  font-size:var(--fs-xs);color:var(--cs-t3);border-top:1px solid var(--cs-line)}
.ndFoot .num{color:var(--cs-t2)}
.ndRole{margin-left:auto;display:inline-flex;align-items:center;gap:3px;padding:1px 5px;
  border-radius:var(--r-pill);background:rgba(232,180,90,.12);color:var(--cs-gold)}
.ndRoleDot{width:5px;height:5px;border-radius:50%;background:currentColor}
.ndBadge{position:absolute;top:6px;right:6px;font-size:var(--fs-xs);padding:1px 5px;
  border-radius:var(--r-pill);background:rgba(11,13,18,.72);color:var(--cs-t3);z-index:3}
.ndBadge.isLive{background:rgba(53,194,166,.16);color:var(--cs-teal)}
.ndPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:30px;height:30px;border-radius:50%;background:rgba(11,13,18,.6);
  display:grid;place-items:center;color:rgba(255,255,255,.9);z-index:2;
  opacity:0;transition:opacity var(--dur) var(--ease)}
.nd:hover .ndPlay{opacity:1}

/* 小地图 */
.minimap{position:absolute;right:var(--sp3);bottom:var(--sp3);width:158px;height:96px;
  background:rgba(21,23,30,.82);backdrop-filter:blur(10px);
  border:1px solid var(--cs-line);border-radius:var(--r-md);overflow:hidden;z-index:20}
.miniNd{position:absolute;background:rgba(255,255,255,.16);border-radius:1px}
.miniNd.isSel{background:var(--cs-accent)}
.miniView{position:absolute;border:1px solid rgba(124,108,255,.65);border-radius:2px;background:rgba(124,108,255,.08)}

/* 画布 HUD */
.hud{position:absolute;left:var(--sp3);bottom:var(--sp3);display:flex;align-items:center;gap:var(--sp3);
  padding:5px 10px;background:rgba(21,23,30,.82);backdrop-filter:blur(10px);
  border:1px solid var(--cs-line);border-radius:var(--r-pill);z-index:20;
  font-size:var(--fs-xs);color:var(--cs-t3)}
.hud b{color:var(--cs-t2);font-weight:400}

/* 框选预览（DD-090 命中预览高亮） */
.marquee{position:absolute;border:1px solid rgba(124,108,255,.6);
  background:rgba(124,108,255,.07);border-radius:2px;pointer-events:none;z-index:14;display:none}
.nd.isHit{border-color:rgba(124,108,255,.6)}

/* 节点详情浮层 */
.inspector{position:absolute;right:var(--sp3);top:var(--sp3);width:272px;
  background:rgba(34,39,58,.94);backdrop-filter:blur(14px);
  border:1px solid var(--cs-line-hi);border-radius:var(--r-lg);box-shadow:var(--sh3);
  z-index:25;overflow:hidden;transform-origin:top right;
  animation:pop var(--dur) var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.insHead{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3);border-bottom:1px solid var(--cs-line)}
.insTitle{font-size:var(--fs-md);font-weight:500;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insBody{padding:var(--sp2) var(--sp3) var(--sp3)}
.insRow{display:flex;align-items:baseline;gap:var(--sp2);padding:3px 0;font-size:var(--fs-sm)}
.insK{color:var(--cs-t3);flex:0 0 64px}
.insV{color:var(--cs-t1);flex:1 1 auto}
.insNote{margin-top:var(--sp2);padding-top:var(--sp2);border-top:1px solid var(--cs-line);
  font-size:var(--fs-xs);color:var(--cs-t3);line-height:1.6}

/* ===================== 时间轴（DD-04 升维） ===================== */
.timeline{flex:0 0 auto;background:var(--cs-shell-2);border-top:1px solid var(--cs-line);z-index:28}
.tlHead{display:flex;align-items:center;gap:var(--sp3);padding:5px var(--sp3);
  border-bottom:1px solid var(--cs-line)}
.tlTitle{font-size:var(--fs-sm);font-weight:500;color:var(--cs-t2);letter-spacing:.03em}
.tlInfo{font-size:var(--fs-xs);color:var(--cs-t3)}
.tlInfo b{color:var(--cs-t2);font-weight:400}
.tlSpacer{flex:1 1 auto}
.tlBgm{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--cs-t3)}
.tlBgm select{background:var(--cs-shell-3);border:1px solid var(--cs-line);border-radius:var(--r-sm);
  color:var(--cs-t2);font-size:var(--fs-xs);padding:2px 6px;outline:none}
.tlBody{padding:6px var(--sp3) 9px}
.tlRuler{position:relative;height:14px;margin-left:56px;margin-bottom:1px;
  border-bottom:1px solid var(--cs-line)}
.tick{position:absolute;top:0;bottom:0;font-size:var(--fs-xs);color:var(--cs-t3)}
.tick::after{content:"";position:absolute;left:0;bottom:0;width:1px;height:3px;background:var(--cs-line-hi)}
.tlTracks{position:relative;display:flex;flex-direction:column;gap:5px;padding-top:5px}
.trk{display:flex;align-items:center;gap:var(--sp2)}
.trkLabel{width:48px;flex:0 0 48px;font-size:var(--fs-xs);color:var(--cs-t3);text-align:right}
.trkLane{position:relative;flex:1 1 auto;min-width:0;height:26px;
  background:rgba(255,255,255,.02);border-radius:var(--r-sm)}
.trkLane.isTall{height:38px}
.clip{position:absolute;top:3px;bottom:3px;border-radius:var(--r-sm);overflow:hidden;
  background:var(--cs-node);border:1px solid var(--cs-line);cursor:pointer;
  transition:all var(--dur-fast) var(--ease)}
.clip:hover{border-color:var(--cs-line-hi);background:var(--cs-node-hi)}
.clip.isSel{border-color:var(--cs-accent);box-shadow:0 0 0 1px rgba(124,108,255,.35)}
.clip.isHot{border-color:rgba(53,194,166,.7)}
.clipArt{position:absolute;inset:0;opacity:.5}
.clipLbl{position:absolute;left:5px;bottom:3px;font-size:var(--fs-xs);color:var(--cs-t1);
  text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
.clipCut{position:absolute;right:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22)}
/* 真波形 */
.waveBox{position:absolute;top:4px;bottom:4px;border-radius:var(--r-sm);overflow:hidden;
  background:rgba(255,255,255,.03);display:flex;align-items:center;gap:1px;padding:0 4px}
.waveBar{flex:1 1 auto;min-width:1px;background:rgba(53,194,166,.55);border-radius:1px}
.refChipRow{position:absolute;inset:0;display:flex;align-items:center;gap:6px;padding:0 8px}
.refChip{font-size:var(--fs-xs);padding:1px 7px;border-radius:var(--r-pill);
  background:rgba(232,180,90,.12);color:var(--cs-gold);white-space:nowrap}
.tlEmpty{font-size:var(--fs-xs);color:var(--cs-t3);padding:6px 8px}
/* 播放头 */
.playhead{position:absolute;top:-18px;bottom:0;width:1px;background:var(--cs-accent);
  box-shadow:0 0 8px rgba(124,108,255,.7);pointer-events:none;z-index:8;
  transition:left 60ms linear}
.playhead::before{content:"";position:absolute;top:0;left:-4px;width:9px;height:9px;
  border-radius:2px;background:var(--cs-accent)}
.phGrip{position:absolute;left:0;top:-18px;width:14px;height:16px;margin-left:-7px;
  cursor:ew-resize;pointer-events:auto}

/* ===================== 右栏：对话 ===================== */
.chat{display:flex;flex-direction:column;min-height:0;background:var(--cs-shell);
  border-left:1px solid var(--cs-line)}
.chatHead{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp2);
  padding:var(--sp3);border-bottom:1px solid var(--cs-line)}
.chatHeadTitle{font-size:var(--fs-md);font-weight:500}
.chatHeadSub{font-size:var(--fs-xs);color:var(--cs-t3)}
.chatScroll{flex:1 1 auto;overflow-y:auto;padding:var(--sp3);display:flex;flex-direction:column;gap:var(--sp3);min-height:0}
.msg{display:flex;flex-direction:column;gap:6px;animation:develop 240ms var(--ease) both}
.msgWho{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--cs-t3)}
.msgAva{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;
  background:var(--cs-shell-3);color:var(--cs-t2)}
.msg.isAgent .msgAva{background:linear-gradient(140deg,#7C6CFF,#5B4BD6);color:#fff}
.bubble{padding:var(--sp2) var(--sp3);border-radius:var(--r-lg);font-size:var(--fs-md);line-height:1.62;
  border:1px solid var(--cs-line);background:var(--cs-shell-2);color:var(--cs-t1)}
.msg.isUser{align-items:flex-end}
.msg.isUser .bubble{background:var(--cs-accent-soft);border-color:rgba(124,108,255,.3);align-self:flex-end;max-width:88%}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-sm);
  background:rgba(255,255,255,.06);padding:1px 4px;border-radius:4px;color:var(--cs-accent-2)}
/* 工具调用卡 */
.tool{border:1px solid var(--cs-line);border-radius:var(--r-md);background:var(--cs-canvas-1);overflow:hidden}
.toolHead{display:flex;align-items:center;gap:var(--sp2);padding:6px var(--sp3);cursor:pointer}
.toolName{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-sm);color:var(--cs-accent-2)}
.toolArg{font-size:var(--fs-xs);color:var(--cs-t3);flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolStat{font-size:var(--fs-xs);color:var(--cs-teal);display:inline-flex;align-items:center;gap:4px}
.toolStat .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.toolBody{display:none;padding:0 var(--sp3) var(--sp3)}
.tool.isOpen .toolBody{display:block}
.toolBody p{margin:0 0 6px;font-size:var(--fs-sm);color:var(--cs-t2);line-height:1.6}
.toolGrid{display:flex;gap:6px;flex-wrap:wrap}
.toolThumb{width:64px;height:40px;border-radius:var(--r-sm);overflow:hidden;background:var(--cs-canvas);border:1px solid var(--cs-line)}
.toolThumb svg{display:block;width:100%;height:100%}
/* 选项卡（澄清） */
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;align-items:center;gap:var(--sp2);padding:7px var(--sp3);border-radius:var(--r-md);
  border:1px solid var(--cs-line);background:var(--cs-shell-2);font-size:var(--fs-sm);color:var(--cs-t2);
  cursor:pointer;transition:all var(--dur-fast) var(--ease)}
.choice:hover{border-color:rgba(124,108,255,.45);color:var(--cs-t1);background:var(--cs-accent-soft)}
.choice.isOn{border-color:var(--cs-accent);background:var(--cs-accent-soft);color:var(--cs-t1)}
.choice .k{width:16px;height:16px;border-radius:50%;border:1px solid var(--cs-line-hi);
  display:grid;place-items:center;font-size:9px;flex:0 0 auto}
.choice.isOn .k{background:var(--cs-accent);border-color:var(--cs-accent);color:#fff}
.chatFoot{flex:0 0 auto;padding:var(--sp3);border-top:1px solid var(--cs-line)}
.composer{display:flex;align-items:flex-end;gap:var(--sp2);padding:var(--sp2) var(--sp3);
  border:1px solid var(--cs-line);border-radius:var(--r-lg);background:var(--cs-shell-2)}
.composer.isFocus{border-color:rgba(124,108,255,.5)}
.composer textarea{flex:1 1 auto;background:none;border:none;outline:none;color:var(--cs-t1);
  font-size:var(--fs-md);resize:none;height:22px;max-height:88px;line-height:1.5;padding:2px 0}
.composer textarea::placeholder{color:var(--cs-t3)}
.sendBtn{width:28px;height:28px;border-radius:50%;background:var(--cs-accent);color:#fff;
  display:grid;place-items:center;flex:0 0 auto;transition:all var(--dur-fast) var(--ease)}
.sendBtn:hover{background:var(--cs-accent-2)}

/* ===================== DD 批注层 ===================== */
.anno{display:none;position:absolute;top:6px;right:6px;z-index:35;
  font-size:var(--fs-xs);padding:1px 6px;border-radius:var(--r-pill);
  background:rgba(124,108,255,.9);color:#fff;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.4);letter-spacing:.02em}
body.annoOn .anno{display:inline-flex;align-items:center;gap:3px}
/* 角标占位：角标固定钉在宿主右上角，开启批注时为它让出等宽空间，
   否则会压住真实控件（下一步 / 合成导出成片 / 帮助 / 新建）。 */
body.annoOn .topbar,
body.annoOn .toolbar,
body.annoOn .workflow,
body.annoOn .tlHead,
body.annoOn .railHead{padding-right:62px}
body.annoOn .chatHead{padding-right:48px}
/* 检查器与角标同处画布右上角：让角标占顶格，检查器下移 */
body.annoOn .inspector{top:38px}
.anno:hover{background:var(--cs-accent-2)}
.annoCard{position:fixed;right:var(--sp4);bottom:var(--sp4);width:320px;z-index:60;
  background:rgba(34,39,58,.97);backdrop-filter:blur(16px);border:1px solid rgba(124,108,255,.4);
  border-radius:var(--r-lg);box-shadow:var(--sh3);padding:var(--sp3);display:none;
  animation:pop var(--dur) var(--ease)}
.annoCard.isOn{display:block}
.annoCard h4{margin:0 0 6px;font-size:var(--fs-md);color:var(--cs-accent-2);font-weight:500}
.annoCard p{margin:0 0 6px;font-size:var(--fs-sm);color:var(--cs-t2);line-height:1.62}
.annoCard ul{margin:0;padding-left:16px;font-size:var(--fs-sm);color:var(--cs-t2);line-height:1.7}
.annoCard .close{margin-left:auto}
.annoCardHead{display:flex;align-items:center;gap:var(--sp2);margin-bottom:6px}
.annoCardHead h4{margin:0}

/* ==========================================================================
   对照模式：还原「改动前」的现状 —— 全部面板同底色、无点阵、无光晕、
   无玻璃。用于直观展示 DD-02 的收益。
   ========================================================================== */
body.cmp{
  --cs-shell:#17191F; --cs-shell-2:#17191F; --cs-shell-3:#1C1E24;
  --cs-canvas:#17191F; --cs-canvas-1:#17191F;
  --cs-node:#17191F; --cs-node-hi:#1B1D23; --cs-float:#17191F;
  --cs-dot:transparent; --cs-dot-major:transparent;
  --cs-glow:none; --cs-dim:1;
}
body.cmp .grid{background-image:
  linear-gradient(to right,rgba(255,255,255,.10) 1px,transparent 1px),
  linear-gradient(to bottom,rgba(255,255,255,.10) 1px,transparent 1px);
  background-size:40px 40px}
body.cmp .nd{box-shadow:none}
body.cmp .nd.isSel{box-shadow:none;outline:2px solid #4A6FE3;outline-offset:-1px}
body.cmp .ndArt{border-top-color:transparent;border-bottom-color:transparent}
body.cmp .nd.isSel .ndArt::after{display:none}
body.cmp .minimap,body.cmp .hud,body.cmp .inspector{backdrop-filter:none;box-shadow:none;background:#17191F}
body.cmp .stLink.isDone{background:var(--cs-line)}
body.cmp .node.isCur{animation:none}
body.cmp .ndScanBand{background:none}
body.cmp .clap{background:rgba(255,255,255,.06)}
body.cmp .waveBar{background:rgba(255,255,255,.28)}
body.cmp .approval{background:rgba(255,255,255,.03);border-left-color:#3A3D45}
body.cmp .apvTitle{color:var(--cs-t2)}
body.cmp .btnGold{background:var(--cs-accent);border-color:var(--cs-accent);color:#fff;font-weight:400}

/* ========================== 响应式 ========================== */
@media (max-width:1400px){
  .frame{grid-template-columns:236px minmax(0,1fr) 400px}
}
@media (max-width:1180px){
  .frame{grid-template-columns:minmax(0,1fr) 380px}
  .rail{display:none}
}
@media (max-width:900px){
  .frame{grid-template-columns:minmax(0,1fr)}
  .chat{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>
<body>
<h2 class="sr-only">Canvas Studio 视觉升维交互设计稿：左中右三栏、六个制作阶段可逐步推进，含画布交互与时间轴</h2>

<div class="app">

  <!-- ======================== 顶栏 ======================== -->
  <header class="topbar">
    <div class="brand">
      <span class="brandMark" id="brandMark"></span>
      <span class="brandText">
        <span class="brandName">Canvas Studio</span>
        <span class="brandSub">创意工厂</span>
      </span>
    </div>
    <span class="topDiv"></span>
    <div class="topProj">
      <span class="topProjName" id="topProjName">凌晨三点的门外人</span>
      <span class="ndChip isShot">写实悬疑 · 75s · 16:9</span>
    </div>
    <span class="topSpacer"></span>
    <div class="topCtl">
      <button class="sw" id="btnCompare" aria-pressed="false" title="切换「改动前 / 方案」的视觉对照">
        <span class="swDot"></span><span id="cmpLabel">对照：改动前</span>
      </button>
      <button class="sw" id="btnAnno" aria-pressed="false" title="显示每处设计对应的 DD 批次">
        <span class="swDot"></span>设计批注
      </button>
      <span class="tbDiv"></span>
      <button class="iconBtn" id="btnHelp" title="交互说明">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.2 2.4c-.6.2-.7.7-.7 1.3v.3"/><path d="M12 17h.01"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="frame">

    <!-- ======================== 左栏 ======================== -->
    <aside class="rail">
      <div class="railHead">
        <span class="railTitle">项目</span>
        <span class="railAct">
          <button class="iconBtn" title="新建分组">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/>
            </svg>
          </button>
          <button class="iconBtn" title="新建项目">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </span>
      </div>
      <div class="railScroll" id="projList"></div>
      <div class="railFoot">
        <div class="userCard">
          <span class="userAva">W</span>
          <span class="userMeta">
            <span class="userName">未名导演</span>
            <span class="userId">UID 88214</span>
          </span>
          <span class="userBal num">1,280 积分</span>
        </div>
      </div>
    </aside>

    <!-- ======================== 中栏 ======================== -->
    <main class="stage">
      <div class="toolbar">
        <button class="tb" id="tbSelect" aria-pressed="true" title="选择 / 移动 (V)">

            <path d="M5 3l14 8-6 1.5L10.5 19z"/>

        </button>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 2">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>框选
        </button>
        <span class="tbDiv"></span>
        <button class="tb" id="tbFit" title="适应视图">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/>
          </svg>适应
        </button>
        <button class="tb" id="tbMinus" title="缩小">−</button>
        <span class="zoomLabel num" id="zoomLabel">100%</span>
        <button class="tb" id="tbPlus" title="放大">+</button>
        <span class="tbDiv"></span>
        <button class="tb" id="tbLayers" aria-pressed="true" title="图层">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">

        <button class="tb" id="tbMini" aria-pressed="true" title="小地图">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">

        <span class="tbSpacer"></span>

            <div class="playhead" id="playhead"><span class="phGrip" id="phGrip"></span></div>

    </main>

    <!-- ======================== 右栏 ======================== -->
    <aside class="chat">
      <div class="chatHead">
        <span class="chatHeadTitle">导演台</span>
        <span class="chatHeadSub" id="chatHeadSub">HITL 审批模式</span>

        <span class="ndChip" id="chatStageChip">阶段 1 / 6</span>
      </div>

      <div class="chatFoot">

<script>

/* 选中时谁算「相关」：选中项自身 + 1 跳血缘邻居（DD-02 只让非相关节点景深）。
   必须先快照选集合再判边，否则逐边累积会退化成多跳扩散。 */
function relatedIds(){
  var m = {};
  var sel = (STATE.multi && STATE.multi.length) ? STATE.multi.slice()
          : (STATE.sel ? [STATE.sel] : []);
  if(!sel.length) return m;
  sel.forEach(function(id){ m[id] = 1; });
  EDGES.forEach(function(e){
    if(sel.indexOf(e[0]) >= 0) m[e[1]] = 1;
    else if(sel.indexOf(e[1]) >= 0) m[e[0]] = 1;
  });
  return m;
}

function renderCanvas(){
  var nodes = visibleNodes();
  var byId = {};
  nodes.forEach(function(n){ byId[n.id] = n; });
  var rel = relatedIds();

  var html = '';
  nodes.forEach(function(n){
    var isSel = STATE.sel === n.id;
    var isDim = STATE.sel !== null && !rel[n.id];
    var isNew = !STATE.born[n.id];
    var kindCls = n.kind === 'film' ? ' isFilm' : '';
    html += '<div class="nd' + (isSel ? ' isSel' : '') + (isDim ? ' isDim' : '')
      + (isNew ? ' isNew' : '') + kindCls + '" data-id="' + n.id + '"'
      + ' style="left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px;height:' + n.h + 'px">'
      + headHTML(n) + bodyHTML(n) + footHTML(n)
      + '</div>';
    STATE.born[n.id] = true;
  });
  $('nodes').innerHTML = html;

  var paths = '';
  EDGES.forEach(function(e){
    var a = byId[e[0]], b = byId[e[1]];
    if(!a || !b) return;
    var x1 = a.x + a.w, y1 = a.y + a.h / 2;
    var x2 = b.x, y2 = b.y + b.h / 2;
    var dx = Math.max(26, Math.abs(x2 - x1) * 0.45);
    var d = 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ','
          + (x2 - dx) + ' ' + y2 + ',' + x2 + ' ' + y2;
    var hot = STATE.sel === e[0] || STATE.sel === e[1];
    paths += '<path class="edge' + (hot ? ' isHot' : '') + '" d="' + d + '"/>';
  });
  var svgEl = $('edges');
  svgEl.setAttribute('width', '1400');
  svgEl.setAttribute('height', '1000');
  svgEl.innerHTML = paths;

  applyView();
  renderMinimap();
  renderHud();
}

function renderMinimap(){
  var mm = $('minimap');
  if(!mm) return;
  if(!STATE.mini){ mm.style.display = 'none'; return; }
  mm.style.display = '';
  var nodes = visibleNodes();
  if(!nodes.length){ mm.innerHTML = ''; return; }
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  nodes.forEach(function(n){
    minX = Math.min(minX, n.x - 50); minY = Math.min(minY, n.y - 50);
    maxX = Math.max(maxX, n.x + n.w + 50); maxY = Math.max(maxY, n.y + n.h + 50);
  });
  var bw = maxX - minX, bh = maxY - minY;
  var s = Math.min(158 / bw, 96 / bh);
  var ox = (158 - bw * s) / 2, oy = (96 - bh * s) / 2;

  var html = '';
  nodes.forEach(function(n){
    html += '<span class="miniNd' + (STATE.sel === n.id ? ' isSel' : '') + '" style="left:'
      + (ox + (n.x - minX) * s).toFixed(1) + 'px;top:' + (oy + (n.y - minY) * s).toFixed(1)
      + 'px;width:' + Math.max(2, n.w * s).toFixed(1) + 'px;height:' + Math.max(2, n.h * s).toFixed(1) + 'px"></span>';
  });
  var wrap = $('canvasWrap');
  var vx = (-STATE.view.x) / STATE.view.k, vy = (-STATE.view.y) / STATE.view.k;
  var vw = wrap.clientWidth / STATE.view.k, vh = wrap.clientHeight / STATE.view.k;
  html += '<span class="miniView" style="left:' + (ox + (vx - minX) * s).toFixed(1)
    + 'px;top:' + (oy + (vy - minY) * s).toFixed(1) + 'px;width:' + (vw * s).toFixed(1)
    + 'px;height:' + (vh * s).toFixed(1) + 'px"></span>';
  mm.innerHTML = html;
}

function renderHud(){
  var nodes = visibleNodes();
  $('hud').innerHTML = '<b class="num">' + Math.round(STATE.view.k * 100) + '%</b>'
    + '<span class="num">' + nodes.length + ' 节点</span>'

function applyView(){

function renderInspector(){

/* ---------- 时间轴（DD-04） ---------- */
function waveHeight(i){
  var s = Math.sin(i * 0.7) * 0.5 + Math.sin(i * 0.23 + 1.1) * 0.32 + Math.sin(i * 1.9) * 0.18;
  return Math.round(22 + Math.abs(s) * 70);
}

function renderTimeline(){
  var ruler = '';
  for(var t = 0; t <= RULER_MAX; t += 2){
    ruler += '<span class="tick num" style="left:' + (t / RULER_MAX * 100) + '%">' + t + 's</span>';
  }
  $('tlRuler').innerHTML = ruler;

  var clips = visibleNodes().filter(function(n){ return n.kind === 'video' && n.dur; });
  var total = 0;
  clips.forEach(function(c){ total += c.dur; });

  var vHtml = '', acc = 0;
  clips.forEach(function(c){
    var left = acc / RULER_MAX * 100;
    var w = c.dur / RULER_MAX * 100;
    var hot = STATE.play && STATE.playT >= acc && STATE.playT < acc + c.dur;
    vHtml += '<div class="clip' + (STATE.sel === c.id ? ' isSel' : '') + (hot ? ' isHot' : '')
      + '" data-clip="' + c.id + '" style="left:' + left + '%;width:calc(' + w + '% - 3px)"'
      + ' title="' + c.idx + ' ' + c.title + ' · ' + c.dur.toFixed(1) + 's（宽度 = 真实时长比例）">'
      + '<span class="clipArt">' + artOf(c.art) + '</span>'
      + '<span class="clipLbl num">' + c.idx + ' · ' + c.dur.toFixed(1) + 's</span>'
      + '<span class="clipCut"></span></div>';
    acc += c.dur;
  });
  $('laneVideo').innerHTML = clips.length ? vHtml
    : '<span class="tlEmpty">暂无视频片段 —— 进入「镜头」阶段后，片段会按真实时长排入轨道</span>';

  var bars = '';
  for(var i = 0; i < 70; i++){
    bars += '<span class="waveBar" style="height:' + waveHeight(i) + '%"></span>';
  }
  $('laneAudio').innerHTML = (STATE.stage >= 4 && STATE.bgm)
    ? '<span class="waveBox" style="left:0;right:0">' + bars + '</span>'
    : '<span class="tlEmpty">' + (STATE.stage >= 4 ? '未选择 BGM' : 'BGM 尚未生成') + '</span>';

  var refs = visibleNodes().filter(function(n){ return n.role; });
  $('laneRef').innerHTML = refs.length
    ? '<span class="refChipRow">' + refs.map(function(n){
        return '<span class="refChip">' + n.role + ' · ' + n.title.split('· ').pop() + '</span>';
      }).join('') + '</span>'
    : '<span class="tlEmpty">参考资产尚未冻结</span>';

  var ratio = total > 0 ? Math.min(1, STATE.playT / RULER_MAX) : 0;
  $('playhead').style.left = 'calc(56px + (100% - 56px) * ' + ratio + ')';

  $('tlInfo').innerHTML = clips.length
    ? '共 <b>' + clips.length + '</b> 个片段 · 预计成片 <b class="num">' + total.toFixed(1) + 's</b>'
      + (STATE.bgm ? ' · 含 BGM' : '')
    : '尚未产生片段';
  $('btnCompose').disabled = clips.length === 0;
}

/* ---------- 统一刷新入口（单向：只在这里调度渲染） ---------- */
function refreshAll(){
  renderProjects();
  renderStRail();
  renderApproval();
  renderCanvas();
  renderTimeline();
  renderChat();
  renderInspector();
}

function fitView(){
  var nodes = visibleNodes();
  var wrap = $('canvasWrap');
  if(!nodes.length || !wrap.clientWidth) return;
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  nodes.forEach(function(n){
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  });
  var pad = 64;
  var w = (maxX - minX) + pad * 2, h = (maxY - minY) + pad * 2;
  var k = Math.min(wrap.clientWidth / w, wrap.clientHeight / h);
  k = Math.max(0.26, Math.min(1.05, k));
  STATE.view.k = k;
  STATE.view.x = (wrap.clientWidth - (maxX - minX) * k) / 2 - minX * k;
  STATE.view.y = (wrap.clientHeight - (maxY - minY) * k) / 2 - minY * k;
  applyView();
  renderMinimap();
  renderHud();
}

/* ==========================================================================
   交互层 —— 事件只做两件事：改 STATE、调 refreshAll() 或局部更新。
   渲染函数之间互不调用，联动一律走 refreshAll()（单向 DAG）。
   ========================================================================== */

function renderEdgesOnly(){
  var byId = {};
  visibleNodes().forEach(function(n){ byId[n.id] = n; });
  var paths = '';
  EDGES.forEach(function(e){
    var a = byId[e[0]], b = byId[e[1]];
    if(!a || !b) return;
    var x1 = a.x + a.w, y1 = a.y + a.h / 2;
    var x2 = b.x, y2 = b.y + b.h / 2;
    var dx = Math.max(26, Math.abs(x2 - x1) * 0.45);
    var hot = STATE.sel === e[0] || STATE.sel === e[1];
    paths += '<path class="edge' + (hot ? ' isHot' : '') + '" d="M' + x1 + ' ' + y1 + ' C'
      + (x1 + dx) + ' ' + y1 + ',' + (x2 - dx) + ' ' + y2 + ',' + x2 + ' ' + y2 + '"/>';
  });
  $('edges').innerHTML = paths;
}

function applySelectionUI(){
  var els = document.querySelectorAll('#nodes .nd');
  var rel = relatedIds();
  Array.prototype.forEach.call(els, function(el){
    var on = STATE.multi.indexOf(el.dataset.id) >= 0;
    el.classList.toggle('isSel', on);
    el.classList.toggle('isDim', STATE.multi.length > 0 && !on && !rel[el.dataset.id]);
  });
  renderEdgesOnly();
  renderInspector();
  renderMinimap();
  renderTimeline();
}

function select(id, additive){
  if(id === null){
    STATE.sel = null; STATE.multi = [];
  } else if(additive){
    var i = STATE.multi.indexOf(id);
    if(i >= 0) STATE.multi.splice(i, 1); else STATE.multi.push(id);
    STATE.sel = STATE.multi.length ? STATE.multi[STATE.multi.length - 1] : null;
  } else {
    STATE.sel = id; STATE.multi = [id];
  }
  applySelectionUI();
}

function setStage(i){
  var next = Math.max(0, Math.min(STAGES.length - 1, i));
  if(next === STATE.stage) return;
  if(next < STATE.stage){
    NODES.forEach(function(n){ if(n.stage > next) delete STATE.born[n.id]; });
  }
  STATE.stage = next;
  STATE.sel = null;
  STATE.multi = [];
  STATE.playT = 0;
  refreshAll();
  fitView();
}

function advance(){
  if(STATE.stage >= STAGES.length - 1) return;
  setStage(STATE.stage + 1);
}

function playClap(){
  var c = $('clapIcon');
  c.classList.remove('isHit');
  void c.offsetWidth;
  c.classList.add('isHit');
}

/* ---------- 播放（联动时间轴高亮与画布选中） ---------- */
var playTimer = null;
function togglePlay(){
  STATE.play = !STATE.play;
  $('playLabel').textContent = STATE.play ? '暂停' : '播放';
  if(STATE.play){
    if(STATE.stage < 4) setStage(4);
    playTimer = setInterval(function(){
      var clips = visibleNodes().filter(function(n){ return n.kind === 'video' && n.dur; });
      var total = 0;
      clips.forEach(function(c){ total += c.dur; });
      STATE.playT += 0.1;
      if(STATE.playT >= total) STATE.playT = 0;
      renderTimeline();
      var acc = 0, cur = null;
      clips.forEach(function(c){
        if(STATE.playT >= acc && STATE.playT < acc + c.dur) cur = c.id;
        acc += c.dur;
      });
      if(cur && STATE.sel !== cur){ STATE.sel = cur; STATE.multi = [cur]; applySelectionUI(); }
    }, 100);
  } else {
    clearInterval(playTimer);
    renderTimeline();
  }
}

/* ---------- 事件绑定 ---------- */
function zoomBy(factor){
  var wrap = $('canvasWrap');
  var mx = wrap.clientWidth / 2, my = wrap.clientHeight / 2;
  var k2 = Math.max(0.2, Math.min(2.4, STATE.view.k * factor));
  var s = k2 / STATE.view.k;
  STATE.view.x = mx - (mx - STATE.view.x) * s;
  STATE.view.y = my - (my - STATE.view.y) * s;
  STATE.view.k = k2;
  applyView(); renderMinimap(); renderHud();
}

function bindEvents(){
  $('btnCompare').addEventListener('click', function(){
    STATE.cmp = !STATE.cmp;
    document.body.classList.toggle('cmp', STATE.cmp);
    this.setAttribute('aria-pressed', String(STATE.cmp));
    $('cmpLabel').textContent = STATE.cmp ? '对照：方案' : '对照：改动前';
    toast(STATE.cmp ? '已切回改动前：所有面板同一底色、无点阵、无景深、无玻璃'
                    : '已切回方案：三档明度 + 点阵 + 景深 + 玻璃浮层');
  });

  $('btnAnno').addEventListener('click', function(){
    STATE.anno = !STATE.anno;
    document.body.classList.toggle('annoOn', STATE.anno);
    this.setAttribute('aria-pressed', String(STATE.anno));
    if(!STATE.anno) $('annoCard').classList.remove('isOn');
    else toast('已打开设计批注 —— 点各处 DD 角标看对应批次');
  });

  $('btnHelp').addEventListener('click', showHelp);

  $('annoCard').addEventListener('click', function(ev){
    if(ev.target.closest('#annoClose')) this.classList.remove('isOn');
  });

  document.addEventListener('click', function(ev){
    var b = ev.target.closest('.anno');
    if(b){ showAnno(b.dataset.code); }
  });

  $('stRail').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-stage]');
    if(b) setStage(Number(b.dataset.stage));
  });
  $('btnPrev').addEventListener('click', function(){ setStage(STATE.stage - 1); });
  $('btnNext').addEventListener('click', advance);

  $('modeSw').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-mode]');
    if(!b) return;
    STATE.mode = b.dataset.mode;
    Array.prototype.forEach.call(this.children, function(c){ c.classList.toggle('isOn', c === b); });
    renderApproval();
    $('chatHeadSub').textContent = STATE.mode === 'hitl' ? 'HITL 审批模式' : '全自动模式';
    toast(STATE.mode === 'auto'
      ? '全自动模式：审批节点自动放行，agent 连续跑完 6 个阶段'
      : 'HITL 模式：剧本 / 分镜 / 关键帧三处停下来等你点头');
  });

  $('btnApprove').addEventListener('click', function(){
    playClap();
    setTimeout(advance, 260);
  });
  $('btnReject').addEventListener('click', function(){
    $('apvSub').textContent = '已打回 —— agent 会带着你的意见重出这一阶段（演示稿不模拟重出过程）';
  });

  $('tbFit').addEventListener('click', fitView);
  $('tbPlus').addEventListener('click', function(){ zoomBy(1.16); });
  $('tbMinus').addEventListener('click', function(){ zoomBy(1 / 1.16); });
  $('tbSelect').addEventListener('click', function(){
    $('tbSelect').setAttribute('aria-pressed', 'true');
    $('tbMarquee').setAttribute('aria-pressed', 'false');
  });
  $('tbMarquee').addEventListener('click', function(){
    $('tbMarquee').setAttribute('aria-pressed', 'true');
    $('tbSelect').setAttribute('aria-pressed', 'false');
    toast('框选：按住 Shift 在空白处拖拽，命中的节点会提前高亮');
  });
  $('tbLayers').addEventListener('click', function(){
    this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    toast('图层面板：真实产品里在画布左侧滑出，列出血缘层级');
  });
  $('tbMini').addEventListener('click', function(){
    STATE.mini = !STATE.mini;
    this.setAttribute('aria-pressed', String(STATE.mini));
    renderMinimap();
  });

  $('btnPlay').addEventListener('click', togglePlay);

  $('laneVideo').addEventListener('click', function(ev){
    var c = ev.target.closest('[data-clip]');
    if(c) select(c.dataset.clip, false);
  });

  $('tlTracks').addEventListener('pointerdown', function(ev){
    var laneRect = $('laneVideo').getBoundingClientRect();
    var scrub = function(clientX){
      var r = Math.max(0, Math.min(1, (clientX - laneRect.left) / laneRect.width));
      STATE.playT = r * RULER_MAX;
      renderTimeline();
    };
    scrub(ev.clientX);
    var mv = function(e){ scrub(e.clientX); };
    var up = function(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
    };
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
  });

  $('bgmSel').addEventListener('change', function(){
    STATE.bgm = this.value;
    renderTimeline();
  });

  $('btnCompose').addEventListener('click', function(){
    if(STATE.stage < 4){ toast('先进入「镜头」阶段，有片段后才能合成'); return; }
    if(STATE.stage === 5){ toast('成片已产出：10.7s · 1920×1080 · 24fps'); return; }
    setStage(5);
    toast('合成完成：单镜保留环境声、多镜仅保留 BGM，时长校验通过');
  });

  $('chatScroll').addEventListener('click', function(ev){
    var th = ev.target.closest('[data-tool]');
    if(th){ th.parentElement.classList.toggle('isOpen'); return; }
    var ch = ev.target.closest('[data-choice]');
    if(ch){
      STATE.choice = Number(ch.dataset.choice);
      renderChat();
      toast('已确认形态：真人写实剧情短片');
    }
  });

  $('projList').addEventListener('click', function(ev){
    var gh = ev.target.closest('.grpHead');
    if(gh){ gh.parentElement.classList.toggle('isCollapsed'); return; }
    var p = ev.target.closest('[data-proj]');
    if(p){
      PROJECTS.forEach(function(g){ g.items.forEach(function(it){ it.on = (it.id === p.dataset.proj); }); });
      renderProjects();
      var item = null;
      PROJECTS.forEach(function(g){ g.items.forEach(function(it){ if(it.on) item = it; }); });
      if(item) $('topProjName').textContent = item.name;
    }
  });

  $('btnSend').addEventListener('click', sendMsg);
  $('composerInput').addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); sendMsg(); }
  });
  $('composerInput').addEventListener('focus', function(){ $('composer').classList.add('isFocus'); });
  $('composerInput').addEventListener('blur', function(){ $('composer').classList.remove('isFocus'); });

  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  bindCanvasGestures();

  document.addEventListener('keydown', function(ev){
    var tag = (ev.target.tagName || '').toLowerCase();
    if(tag === 'textarea' || tag === 'input') return;
    if(ev.key === 'ArrowRight'){ advance(); }
    else if(ev.key === 'ArrowLeft'){ setStage(STATE.stage - 1); }
    else if(ev.key === 'Escape'){
      var lb = document.getElementById('lightbox');
      if(lb){ lb.remove(); return; }
      select(null);
      $('annoCard').classList.remove('isOn');
    } else if(ev.key === ' '){ ev.preventDefault(); togglePlay(); }
    else if(ev.key === 'f' || ev.key === 'F'){ fitView(); }
  });

  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(fitView, 140);
  });
}

function sendMsg(){
  var inp = $('composerInput');
  var v = inp.value.trim();
  if(!v) return;
  var st = STAGES[STATE.stage];
  st.msgs.push({ who:'user', text: v });
  st.msgs.push({ who:'agent', text:'收到。已记入当前阶段（' + st.label + '）的上下文，继续按 '
    + (STATE.mode === 'hitl' ? 'HITL 审批节奏' : '全自动模式') + '推进。' });
  inp.value = '';
  renderChat();
}

/* ---------- 画布手势：不使用 setPointerCapture ----------
   依据 CV-089 的经验：pointerdown 立即捕获会把后续 mousedown/up 重定向到容器，
   导致 dblclick 目标变成容器、节点收不到双击。这里统一用 document 级监听，
   从根上避开该问题。 */
var drag = null;

function bindCanvasGestures(){
  var canvas = $('canvas');
  var wrap = $('canvasWrap');

  canvas.addEventListener('wheel', function(ev){
    ev.preventDefault();
    var rect = wrap.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    var k2 = Math.max(0.2, Math.min(2.4, STATE.view.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    var s = k2 / STATE.view.k;
    STATE.view.x = mx - (mx - STATE.view.x) * s;
    STATE.view.y = my - (my - STATE.view.y) * s;
    STATE.view.k = k2;
    applyView(); renderMinimap(); renderHud();
  }, { passive:false });

  canvas.addEventListener('pointerdown', function(ev){
    if(ev.button !== 0) return;
    var ndEl = ev.target.closest('.nd');
    if(ndEl){
      var n = nodeById(ndEl.dataset.id);
      if(!n) return;
      select(n.id, ev.shiftKey || ev.metaKey);
      drag = { mode:'node', id:n.id, el:ndEl, sx:ev.clientX, sy:ev.clientY, ox:n.x, oy:n.y, moved:false };
      return;
    }
    if(ev.shiftKey){
      drag = { mode:'marquee', sx:ev.clientX, sy:ev.clientY, rect:wrap.getBoundingClientRect(), hits:[] };
      return;
    }
    drag = { mode:'pan', sx:ev.clientX, sy:ev.clientY, vx:STATE.view.x, vy:STATE.view.y, moved:false };
    canvas.classList.add('isPanning');
  });

  canvas.addEventListener('dblclick', function(ev){
    var ndEl = ev.target.closest('.nd');
    if(!ndEl) return;
    var n = nodeById(ndEl.dataset.id);
    if(n && (n.kind === 'video' || n.kind === 'film' || n.kind === 'image')) openLightbox(n);
  });
}

function onPointerMove(ev){
  if(!drag) return;
  if(drag.mode === 'pan'){
    STATE.view.x = drag.vx + (ev.clientX - drag.sx);
    STATE.view.y = drag.vy + (ev.clientY - drag.sy);
    drag.moved = true;
    applyView(); renderMinimap();
    return;
  }
  if(drag.mode === 'node'){
    var n = nodeById(drag.id);
    if(!n) return;
    var dx = (ev.clientX - drag.sx) / STATE.view.k;
    var dy = (ev.clientY - drag.sy) / STATE.view.k;
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) drag.moved = true;
    n.x = Math.round(drag.ox + dx);
    n.y = Math.round(drag.oy + dy);
    drag.el.style.left = n.x + 'px';
    drag.el.style.top = n.y + 'px';
    drag.el.classList.add('isDrag');
    renderEdgesOnly(); renderMinimap();
    return;
  }
  if(drag.mode === 'marquee'){
    var r = drag.rect;
    var w = Math.abs(ev.clientX - drag.sx), h = Math.abs(ev.clientY - drag.sy);
    var x1 = Math.min(drag.sx, ev.clientX) - r.left;
    var y1 = Math.min(drag.sy, ev.clientY) - r.top;
    var mq = $('marquee');
    mq.style.display = 'block';
    mq.style.left = x1 + 'px';
    mq.style.top = y1 + 'px';
    mq.style.width = w + 'px';
    mq.style.height = h + 'px';

    var wx1 = (x1 - STATE.view.x) / STATE.view.k, wy1 = (y1 - STATE.view.y) / STATE.view.k;
    var wx2 = wx1 + w / STATE.view.k, wy2 = wy1 + h / STATE.view.k;
    var hits = [];
    Array.prototype.forEach.call(document.querySelectorAll('#nodes .nd'), function(el){
      var nd = nodeById(el.dataset.id);
      var hit = !(nd.x > wx2 || nd.x + nd.w < wx1 || nd.y > wy2 || nd.y + nd.h < wy1);
      el.classList.toggle('isHit', hit);
      if(hit) hits.push(nd.id);
    });
    drag.hits = hits;
  }
}

function onPointerUp(){
  if(!drag) return;
  var canvas = $('canvas');
  if(drag.mode === 'node'){
    drag.el.classList.remove('isDrag');
  } else if(drag.mode === 'marquee'){
    $('marquee').style.display = 'none';
    Array.prototype.forEach.call(document.querySelectorAll('.nd.isHit'), function(el){
      el.classList.remove('isHit');
    });
    var hits = drag.hits || [];
    if(hits.length){
      STATE.multi = hits.slice();
      STATE.sel = hits[hits.length - 1];
      applySelectionUI();
      toast('已框选 ' + hits.length + ' 个节点');
    }
  } else if(drag.mode === 'pan' && !drag.moved){
    select(null);
  }
  canvas.classList.remove('isPanning');
  drag = null;
}

/* ==========================================================================
   初始化 —— 严格单向：先注入静态装饰 → 绑定事件 → refreshAll() 一次渲染
   ========================================================================== */

    + '<rect x="2" y="2" width="28" height="28" rx="8" fill="#7C6CFF"/>'
    + '<rect x="2" y="13" width="28" height="4" fill="#5B4BD6"/>'
    + '<path d="M9 11 L13 11 L16 4 L12 4 Z" fill="#5B4BD6"/>'
    + '<path d="M18 11 L22 11 L25 4 L21 4 Z" fill="#5B4BD6"/></svg>';

  $('clapIcon').innerHTML = '<svg width="16" height="16" viewBox="0 0 32 32" fill="none">'
    + '<rect x="3" y="14" width="26" height="14" rx="3" fill="currentColor" opacity=".9"/>'
    + '<rect x="3" y="8" width="26" height="6" rx="2" fill="currentColor"/>'
    + '<path d="M8 8 L12 8 L14 3 L10 3 Z" fill="#15171E"/>'
    + '<path d="M17 8 L21 8 L23 3 L19 3 Z" fill="#15171E"/></svg>';

  injectAnnos();
  STATE.choice = 0;
  STATE.mini = true;
  STATE.stage = STAGES.length - 1;
  bindEvents();
  refreshAll();
  requestAnimationFrame(function(){
    fitView();
    setTimeout(function(){
      toast('已展示完成态（6/6）· 点顶部轨道「剧本」可从第一步重新走一遍');
    }, 900);
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
