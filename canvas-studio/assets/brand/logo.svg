<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 96" role="img" aria-label="Canvas Studio 场记板">
  <!-- 顶部铰链条 -->
  <rect x="0" y="0" width="118" height="11" rx="3" fill="#E8E8E8"/>
  <!-- 上半白板：画布点阵（品牌紫） -->
  <rect x="0" y="11" width="46" height="85" fill="#F4F4F6"/>
  <circle cx="16" cy="34" r="3.2" fill="#7C6CFF"/>
  <circle cx="31" cy="34" r="3.2" fill="#7C6CFF" opacity="0.5"/>
  <circle cx="16" cy="52" r="3.2" fill="#7C6CFF" opacity="0.5"/>
  <circle cx="31" cy="52" r="3.2" fill="#7C6CFF"/>
  <circle cx="16" cy="70" r="3.2" fill="#7C6CFF"/>
  <circle cx="31" cy="70" r="3.2" fill="#7C6CFF" opacity="0.5"/>
  <circle cx="16" cy="88" r="3.2" fill="#7C6CFF" opacity="0.5"/>
  <circle cx="31" cy="88" r="3.2" fill="#7C6CFF"/>
  <!-- 下半斜条纹板（品牌紫 + deep 斜条） -->
  <rect x="46" y="11" width="72" height="85" fill="#7C6CFF"/>
  <g stroke="#5B4BD6" stroke-width="13" opacity="0.55">
    <line x1="46" y1="96" x2="82" y2="60"/>
    <line x1="66" y1="96" x2="102" y2="60"/>
    <line x1="86" y1="96" x2="118" y2="68"/>
  </g>
</svg>
