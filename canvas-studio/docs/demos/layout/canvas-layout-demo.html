  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; height: 100vh; }

  .tabs { display: flex; background: #161b22; border-bottom: 1px solid #30363d; padding: 0 16px; height: 48px; align-items: center; gap: 4px; }
  .tab { padding: 8px 20px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 14px; color: #8b949e; border: 1px solid transparent; border-bottom: none; transition: all .2s; white-space: nowrap; }
  .tab:hover { color: #c9d1d9; background: #21262d; }
  .tab.active { color: #f0f6fc; background: #0d1117; border-color: #30363d; font-weight: 600; }
  .tab .badge { display: inline-block; background: #238636; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; font-weight: 600; }
  .tab .badge.rec { background: #1f6feb; }

  .canvas-wrap { position: relative; width: 100%; height: calc(100vh - 48px); overflow: hidden; cursor: grab; }
  .canvas-wrap:active { cursor: grabbing; }
  .canvas { position: absolute; transform-origin: 0 0; }

  .node { position: absolute; border-radius: 8px; border: 1.5px solid #30363d; overflow: hidden; cursor: pointer; transition: box-shadow .2s, border-color .2s; }
  .node:hover { border-color: #58a6ff; box-shadow: 0 0 20px rgba(88,166,255,.15); z-index: 100 !important; }
  .node.selected { border-color: #f78166; box-shadow: 0 0 20px rgba(247,129,102,.2); }

  .node-header { padding: 6px 10px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .node-body { padding: 8px 10px; font-size: 11px; color: #8b949e; line-height: 1.5; max-height: 120px; overflow: hidden; }
  .node-body img { width: 100%; border-radius: 4px; margin-top: 4px; }
  .node-type { font-size: 9px; padding: 1px 6px; border-radius: 10px; font-weight: 500; }
  .node-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .kind-text { background: #1c2333; }
  .kind-text .node-header { color: #58a6ff; }
  .kind-image { background: #1a2332; }
  .kind-image .node-header { color: #3fb950; }
  .kind-video { background: #2a1a2e; }
  .kind-video .node-header { color: #d2a8ff; }
  .kind-audio { background: #1a2a1a; }
  .kind-audio .node-header { color: #56d364; }
  .kind-group { background: #1c1c1c; border-style: dashed; }
  .kind-group .node-header { color: #8b949e; }

  svg.edges { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  svg.edges line { stroke: #30363d; stroke-width: 1.5; }
  svg.edges line.highlight { stroke: #58a6ff; stroke-width: 2; }
  svg.edges marker path { fill: #30363d; }

  .legend { position: fixed; bottom: 16px; left: 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-size: 12px; z-index: 50; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #30363d; }

  .info-panel { position: fixed; top: 64px; right: 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; width: 280px; font-size: 12px; z-index: 50; max-height: calc(100vh - 80px); overflow-y: auto; }
  .info-panel h3 { font-size: 14px; margin-bottom: 8px; color: #f0f6fc; }
  .info-panel p { color: #8b949e; line-height: 1.6; margin-bottom: 8px; }
  .info-panel ul { padding-left: 16px; color: #8b949e; line-height: 1.8; }
  .info-panel .tag { display: inline-block; background: #21262d; padding: 2px 8px; border-radius: 4px; margin: 2px; font-size: 11px; }

  .zoom-controls { position: fixed; bottom: 16px; right: 16px; display: flex; gap: 4px; z-index: 50; }
  .zoom-btn { width: 36px; height: 36px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { background: #21262d; }

  .flow-label { position: absolute; font-size: 10px; color: #484f58; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; pointer-events: none; }
  .column-bg { position: absolute; border-radius: 12px; pointer-events: none; }

// ========== 画布自动整理算法 ==========
// 规则文档见 canvas-layout-rules.txt

const COL_W = 420;     // 列宽
const ROW_GAP = 20;    // 节点间距
const COL_GAP = 40;    // 列间距

function computeAutoLayout() {
  // --- 1. 构建依赖图 ---
  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });

  const childrenOf = {};  // parentId → [childId]
  const refsOf = {};      // nodeId → [refId]
  nodes.forEach(n => {
    refsOf[n.id] = n.refs || [];
    (n.refs || []).forEach(refId => {
      if (!childrenOf[refId]) childrenOf[refId] = [];
      childrenOf[refId].push(n.id);
    });
  });

  // --- 2. 计算拓扑层级 (最长路径) ---
  const level = {};
  function getLevel(id) {
    if (level[id] !== undefined) return level[id];
    const refs = refsOf[id];
    if (!refs || refs.length === 0) { level[id] = 0; return 0; }
    let maxParentLevel = -1;
    refs.forEach(refId => {
      const pl = getLevel(refId);
      if (pl > maxParentLevel) maxParentLevel = pl;
    });
    level[id] = maxParentLevel + 1;
    return level[id];
  }
  nodes.forEach(n => getLevel(n.id));

  // --- 3. 按层级分组 ---
  const levels = {};
  nodes.forEach(n => {
    const lv = level[n.id];
    if (!levels[lv]) levels[lv] = [];
    levels[lv].push(n);
  });

  // --- 4. 每层内按原始 x 排序 ---
  const sortedLevels = Object.keys(levels).sort((a, b) => a - b);
  sortedLevels.forEach(lv => {
    levels[lv].sort((a, b) => {
      const ax = (currentLayoutPos && currentLayoutPos[a.id]) ? currentLayoutPos[a.id].x : 0;
      const bx = (currentLayoutPos && currentLayoutPos[b.id]) ? currentLayoutPos[b.id].x : 0;
      return ax - bx;
    });
  });

  // --- 5. 分配列号 (核心: 子节点列号 > 父节点列号) ---
  const colOf = {};  // nodeId → column index
  const rowOf = {};  // nodeId → row within column

  // 先给第0层分配列
  if (levels[0]) {
    levels[0].forEach((n, i) => { colOf[n.id] = i; });
  }

  // 逐层分配: 子节点列号 = max(父节点列号) + 1
  sortedLevels.forEach(lv => {
    if (lv === '0') return;
    levels[lv].forEach(n => {
      const refs = refsOf[n.id];
      if (!refs || refs.length === 0) {
        // 无依赖, 按层级顺序排
        colOf[n.id] = parseInt(lv);
        return;
      }
      let maxParentCol = -1;
      refs.forEach(refId => {
        const pc = colOf[refId];
        if (pc !== undefined && pc > maxParentCol) maxParentCol = pc;
      });
      colOf[n.id] = maxParentCol + 1;
    });
  });

  // --- 6. 依赖关系正确性验证与修复 ---
  // 目的: 确保每一条依赖边都满足 col(child) > col(parent)
  // 这是全局正确性保证，不仅是同列修复
  let changed = true;
  let iterations = 0;
  while (changed && iterations < 100) {
    changed = false;
    iterations++;
    nodes.forEach(n => {
      const refs = refsOf[n.id];
      if (!refs || refs.length === 0) return;
      refs.forEach(refId => {
        if (colOf[n.id] <= colOf[refId]) {
          // 违反约束: 子节点不在父节点右侧，强制右移
          colOf[n.id] = colOf[refId] + 1;
          changed = true;
        }
      });
    });
  }

  // --- 7. 收集每列的节点, 分配行号 ---
  const columns = {};
  nodes.forEach(n => {
    const c = colOf[n.id];
    if (!columns[c]) columns[c] = [];
    columns[c].push(n);
  });

  // 每列内按原始 y 排序, 然后分配行号
  const colPositions = {};
  Object.keys(columns).sort((a, b) => a - b).forEach(colIdx => {
    const col = columns[colIdx];
    col.sort((a, b) => {
      const ay = (currentLayoutPos && currentLayoutPos[a.id]) ? currentLayoutPos[a.id].y : 0;
      const by = (currentLayoutPos && currentLayoutPos[b.id]) ? currentLayoutPos[b.id].y : 0;
      return ay - by;
    });

    let curY = 40;
    col.forEach(n => {
      const h = n.kind === 'group' ? 0 : (n.superseded ? 80 : (n.kind === 'video' ? 340 : (n.kind === 'image' ? 350 : 200)));
      colPositions[n.id] = {
        x: 40 + colIdx * (COL_W + COL_GAP),
        y: curY,
        w: n.kind === 'group' ? COL_W - 20 : (n.kind === 'video' ? 480 : (n.kind === 'image' && !n.superseded ? 480 : 360)),
        h: h,
      };
      curY += h + ROW_GAP;
    });
  });

  // --- 8. 处理 group 节点: 包裹子节点 ---
  nodes.filter(n => n.kind === 'group').forEach(g => {
    const childIds = childrenOf[g.id] || [];
    if (childIds.length === 0) return;
    // group 的位置由其子节点决定
    let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
    childIds.forEach(cid => {
      const p = colPositions[cid];
      if (!p) return;
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x + p.w > maxX) maxX = p.x + p.w;
      if (p.y + p.h > maxY) maxY = p.y + p.h;
    });
    if (minX < Infinity) {
      colPositions[g.id] = {
        x: minX - 10,
        y: minY - 10,
        w: maxX - minX + 20,
        h: maxY - minY + 20,
      };
    }
  });

  // --- 9. 隐藏 deprecated 节点 (superseded 且有更新版本) ---
  nodes.forEach(n => {
    if (n.superseded && colPositions[n.id]) {
      colPositions[n.id].w = 180;
      colPositions[n.id].h = 60;
    }
  });

  return colPositions;
}

// 用当前布局作为参考坐标
let currentLayoutPos = null;

function getAutoLayout() {
  // 使用 current 布局的坐标作为参考
  currentLayoutPos = layouts.current.nodes;
  const pos = computeAutoLayout();
  currentLayoutPos = null;
  return pos;
}

// ========== RENDERING ==========
let currentTab = 'current';
let scale = 0.55;
let panX = 40, panY = 20;
let isDragging = false, dragStartX, dragStartY, panStartX, panStartY;

const canvas = document.getElementById('canvas');
const canvasWrap = document.getElementById('canvasWrap');

function getNodeColor(kind) {
  const map = { text:'#58a6ff', image:'#3fb950', video:'#d2a8ff', audio:'#56d364', group:'#8b949e' };
  return map[kind] || '#8b949e';
}

function getKindLabel(kind) {
  const map = { text:'文本', image:'图片', video:'视频', audio:'音频', group:'分组' };
  return map[kind] || kind;
}

function getToolLabel(toolName) {
  const map = {
    'user_brief': '用户输入',
    'music_generation': '音乐生成',
    'image_generate': '图像生成',
    'write_screenplay': '剧本撰写',
    'storyboard': '分镜脚本',
    'character_sheet': '角色设定',
    'write_script': '文案撰写',
    'video_composite': '视频合成',
    'extract_last_frame': '提取末帧',
  };
  return map[toolName] || toolName;
}

function renderEdges(layout) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.classList.add('edges');

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  marker.setAttribute('id', 'arrowhead');
  marker.setAttribute('markerWidth', '8');
  marker.setAttribute('markerHeight', '6');
  marker.setAttribute('refX', '8');
  marker.setAttribute('refY', '3');
  marker.setAttribute('orient', 'auto');
  const arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  arrowPath.setAttribute('d', 'M0,0 L8,3 L0,6 Z');
  arrowPath.setAttribute('fill', '#30363d');
  marker.appendChild(arrowPath);
  defs.appendChild(marker);

  // highlight markers
  (layout.highlights || []).forEach((h, i) => {
    const m = marker.cloneNode(true);
    m.setAttribute('id', `arrow-hl-${i}`);
    m.querySelector('path').setAttribute('fill', h.color);
    defs.appendChild(m);
  });

  svg.appendChild(defs);

  const pos = layout.nodes;

  // highlight edges first
  (layout.highlights || []).forEach((h, i) => {
    const from = pos[h.from], to = pos[h.to];
    if (!from || !to) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', from.x + from.w);
    line.setAttribute('y1', from.y + from.h / 2);
    line.setAttribute('x2', to.x);
    line.setAttribute('y2', to.y + to.h / 2);
    line.setAttribute('stroke', h.color);
    line.setAttribute('stroke-width', '2');
    line.setAttribute('marker-end', `url(#arrow-hl-${i})`);
    line.setAttribute('opacity', '0.6');
    svg.appendChild(line);
  });

  // regular edges
  nodes.forEach(n => {
    if (!n.refs || n.refs.length === 0) return;
    const to = pos[n.id];
    if (!to || to.w === 0) return;
    n.refs.forEach(refId => {
      const from = pos[refId];
      if (!from || from.w === 0) return;
      // skip if this is a highlighted edge
      const isHl = (layout.highlights || []).some(h =>
        (h.from === refId && h.to === n.id) || (h.from === n.id && h.to === refId)
      );
      if (isHl) return;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', from.x + from.w);
      line.setAttribute('y1', from.y + from.h / 2);
      line.setAttribute('x2', to.x);
      line.setAttribute('y2', to.y + to.h / 2);
      line.setAttribute('marker-end', 'url(#arrowhead)');
      if (n.superseded) { line.setAttribute('stroke-dasharray', '4,4'); line.setAttribute('opacity', '0.3'); }
      svg.appendChild(line);
    });
  });

  return svg;
}

function renderColumnBands(layout) {
  const frag = document.createDocumentFragment();
  (layout.columnBands || []).forEach(band => {
    const div = document.createElement('div');
    div.className = 'column-bg';
    div.style.left = band.x + 'px';
    div.style.top = (band.y || 0) + 'px';
    div.style.width = band.w + 'px';
    div.style.height = (band.h || 700) + 'px';
    div.style.background = band.color;
    div.style.border = '1px dashed ' + band.color.replace('0.04', '0.15').replace('0.06', '0.15');
    frag.appendChild(div);

    if (band.label && !band.isPanel) {
      const lbl = document.createElement('div');
      lbl.className = 'flow-label';
      lbl.style.left = (band.x + 8) + 'px';
      lbl.style.top = ((band.y || 0) + 8) + 'px';
      lbl.textContent = band.label;
      frag.appendChild(lbl);
    }
    if (band.isPanel) {
      const lbl = document.createElement('div');
      lbl.className = 'flow-label';
      lbl.style.left = (band.x + 8) + 'px';
      lbl.style.top = ((band.y || 0) + 8) + 'px';
      lbl.textContent = band.label;
      lbl.style.color = '#3fb950';
      frag.appendChild(lbl);
    }
  });
  return frag;
}

function renderTimeMarkers(layout) {
  const frag = document.createDocumentFragment();
  (layout.timeMarkers || []).forEach(tm => {
    const line = document.createElement('div');
    line.style.cssText = `position:absolute;left:${tm.x}px;top:0;width:1px;height:700px;border-left:2px dashed ${tm.color};opacity:0.3;pointer-events:none;`;
    frag.appendChild(line);
    const lbl = document.createElement('div');
    lbl.className = 'flow-label';
    lbl.style.left = (tm.x + 4) + 'px';
    lbl.style.top = '0px';
    lbl.style.color = tm.color;
    lbl.textContent = tm.label;
    frag.appendChild(lbl);
  });
  return frag;
}

function render() {
  let layout = layouts[currentTab];
  // 动态计算自动整理布局
  if (currentTab === 'autoLayout') {
    layout = { ...layout, nodes: getAutoLayout() };
  }
  canvas.innerHTML = '';
  canvas.appendChild(renderColumnBands(layout));
  canvas.appendChild(renderTimeMarkers(layout));

  // render edges
  canvas.appendChild(renderEdges(layout));

  // render nodes
  nodes.forEach(n => {
    const pos = layout.nodes[n.id];
    if (!pos || pos.w === 0) return;

    const div = document.createElement('div');
    div.className = `node kind-${n.kind}`;
    if (n.superseded) div.style.opacity = '0.4';
    if (pos.collapsed) div.style.opacity = '0.6';
    div.style.left = pos.x + 'px';
    div.style.top = pos.y + 'px';
    div.style.width = pos.w + 'px';
    div.style.height = pos.h + 'px';
    div.style.zIndex = n.kind === 'video' ? 10 : 5;

    const headerColor = getNodeColor(n.kind);

    let headerHTML = `
      <div class="node-header" style="background:${headerColor}15">
        <span class="node-type" style="background:${headerColor}25;color:${headerColor}">${getKindLabel(n.kind)}</span>
        <span class="node-title">${n.title}</span>
        ${n.superseded ? '<span style="color:#f85149;font-size:9px">已替代</span>' : ''}
        ${pos.collapsed ? '<span style="color:#8b949e;font-size:9px">📎</span>' : ''}
      </div>`;

    // Asset thumbnail
    let assetHTML = '';
    if (n.asset && pos.h > 60) {
      const url = ASSET_BASE + '/' + n.asset;
      if (n.kind === 'image') {
        assetHTML = '<img class="node-thumb" src="' + url + '" style="max-height:' + (pos.h - 34) + 'px;object-fit:cover;" onerror="this.style.display=\'none\'">';
      } else if (n.kind === 'video') {
        assetHTML = '<div class="node-video-wrap" style="height:' + (pos.h - 34) + 'px"><video src="' + url + '" muted preload="metadata" style="height:100%;object-fit:cover"></video><div class="play-icon"></div></div>';
      } else if (n.kind === 'audio') {
        assetHTML = '<div style="padding:6px 10px;display:flex;align-items:center;gap:8px"><div class="audio-bars"><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div></div><span style="font-size:10px;color:#484f58">' + n.short + '</span></div>';
      }
    }
    
    let bodyHTML = '';
    if (pos.h > 80 && !n.asset) {
      bodyHTML = '<div class="node-body"><div style="color:' + headerColor + ';font-size:10px;margin-bottom:4px">' + n.short + '</div>';
      bodyHTML += '<div style="font-size:9px;color:#484f58">' + getToolLabel(n.toolName) + '</div>';
      if (n.refs && n.refs.length) bodyHTML += '<div style="margin-top:4px;font-size:9px;color:#484f58">\u2190 ' + n.refs.length + '个依赖</div>';
      bodyHTML += '</div>';
    }

    div.innerHTML = headerHTML + assetHTML + bodyHTML;
    canvas.appendChild(div);
  });

  updateTransform();
  updateInfoPanel();
}

function updateTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function updateInfoPanel() {
  const panel = document.getElementById('infoPanel');
  let layout = layouts[currentTab];
  if (currentTab === 'autoLayout') {
    layout = { ...layout, nodes: getAutoLayout() };
  }

  let html = `<h3>${layout.title}</h3><p>${layout.desc}</p>`;

  if (currentTab === 'autoLayout') {
    html += `
      <div style="margin-top:12px">
        <div style="font-weight:600;color:#f0f6fc;margin-bottom:6px">自动整理规则</div>
        <ul>
          <li><b>层级计算</b>: 按依赖深度分配层级 (创意=0, 剧本=1, 分镜=2...)</li>
          <li><b>列号分配</b>: 子节点列号 = max(父节点列号) + 1</li>
          <li><b>正确性验证</b>: 全局检查每条依赖边，确保 col(child) > col(parent)</li>
          <li><b>级联修复</b>: 修复一个节点后，其子孙节点自动重新验证</li>
          <li><b>行内排序</b>: 同列内按原始 y 坐标排列</li>
          <li><b>Group包裹</b>: 分组节点自动包裹其子节点</li>
          <li><b>废弃折叠</b>: superseded 节点缩小显示</li>
        </ul>
      </div>
      <div style="margin-top:8px;padding:8px;background:#21262d;border-radius:6px;font-size:11px">
        <div style="color:#3fb950;font-weight:600;margin-bottom:4px">核心约束 (最高准则)</div>
        <div style="color:#c9d1d9">所有子节点必须在所有父节点的右侧</div>
        <div style="color:#8b949e;margin-top:4px">col(child) > col(parent)  ∀ parent ∈ refs(child)</div>
        <div style="color:#8b949e;margin-top:2px">无论初始分配如何，最终结果必须满足此约束</div>
      </div>`;
  } else if (currentTab === 'fixSameCol') {
    html += `
      <div style="margin-top:12px">
        <div style="font-weight:600;color:#f0f6fc;margin-bottom:6px">修正说明</div>
        <ul>
          <li>检测同列父子关系：<span style="color:#3fb950">e402f62d(角色表)</span> 与 <span style="color:#3fb950">83b2b311(参考图·色彩)</span> 同在 x:1264</li>
          <li>将子节点移到父节点右侧新列 x:1744</li>
          <li>所有 x≥1744 的节点同步右移 480px</li>
          <li>绿色连线标记修正过的依赖关系</li>
        </ul>
      </div>
      <div style="margin-top:8px;padding:8px;background:#21262d;border-radius:6px;font-size:11px">
        <div style="color:#3fb950;font-weight:600;margin-bottom:4px">修正前后对比</div>
        <div>角色表 x: <span style="text-decoration:line-through;color:#f85149">1264</span> → <span style="color:#3fb950">1744</span></div>
        <div>分镜1视频v2 x: <span style="text-decoration:line-through;color:#f85149">2296</span> → <span style="color:#3fb950">2776</span></div>
        <div>分镜2视频v2 x: <span style="text-decoration:line-through;color:#f85149">1804</span> → <span style="color:#3fb950">2284</span></div>
        <div>文案 x: <span style="text-decoration:line-through;color:#f85149">2836</span> → <span style="color:#3fb950">3316</span></div>
      </div>`;
  } else if (currentTab === 'swimlane') {
    html += `
      <div style="margin-top:12px">
        <div style="font-weight:600;color:#f0f6fc;margin-bottom:6px">布局规则</div>
        <ul>
          <li>每个分镜独占一行，父子关系严格左→右</li>
          <li>参考资产集中在独立区域，支持折叠</li>
          <li>v1/v2版本节点折叠显示</li>
          <li>主流程用 <span style="color:#f78166">橙色</span> 高亮</li>
          <li>产出物用 <span style="color:#d2a8ff">紫色</span> 高亮</li>
        </ul>
      </div>`;
  } else if (currentTab === 'hierarchy') {
    html += `
      <div style="margin-top:12px">
        <div style="font-weight:600;color:#f0f6fc;margin-bottom:6px">布局规则</div>
        <ul>
          <li>按层级列排列：根→剧本→分镜→参考→视频</li>
          <li>参考图折叠显示（半透明），展开可查看</li>
          <li>废弃节点（v1）折叠到边缘</li>
        </ul>
      </div>`;
  } else if (currentTab === 'hybrid') {
    html += `
      <div style="margin-top:12px">
        <div style="font-weight:600;color:#f0f6fc;margin-bottom:6px">布局规则</div>
        <ul>
          <li>主流程用泳道排列</li>
          <li>视频产出用大卡片突出显示</li>
          <li>参考资产集中到底部面板</li>
          <li>废弃节点完全隐藏</li>
        </ul>
      </div>`;
  } else if (currentTab === 'timeline') {
    html += `
      <div style="margin-top:12px">
        <div style="font-weight:600;color:#f0f6fc;margin-bottom:6px">布局规则</div>
        <ul>
          <li>按视频时间线从左到右：0s→8s→17s→30s</li>
          <li>每段分镜及其参考图并排</li>
          <li>时间点用虚线标注</li>
          <li>适合理解视频时间推进</li>
        </ul>
      </div>`;
  }

  // Node count stats
  const visibleNodes = nodes.filter(n => {
    const p = layout.nodes[n.id];
    return p && p.w > 0;
  });
  html += `
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid #30363d">
      <div style="font-weight:600;color:#f0f6fc;margin-bottom:6px">节点统计</div>
      <div class="tag">可见: ${visibleNodes.length}/${nodes.length}</div>
      <div class="tag">文本: ${visibleNodes.filter(n=>n.kind==='text').length}</div>
      <div class="tag">图片: ${visibleNodes.filter(n=>n.kind==='image').length}</div>
      <div class="tag">视频: ${visibleNodes.filter(n=>n.kind==='video').length}</div>
      <div class="tag">音频: ${visibleNodes.filter(n=>n.kind==='audio').length}</div>
    </div>`;

  panel.innerHTML = html;
}

// ========== INTERACTIONS ==========
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    resetView();
    render();
  });
});

// Pan
canvasWrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  updateTransform();
});
window.addEventListener('mouseup', () => { isDragging = false; });

// Zoom
canvasWrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.05 : 0.05;
  scale = Math.max(0.15, Math.min(2, scale + delta));
  updateTransform();
}, { passive: false });

function zoomIn() { scale = Math.min(2, scale + 0.1); updateTransform(); }
function zoomOut() { scale = Math.max(0.15, scale - 0.1); updateTransform(); }
function resetView() { scale = 0.55; panX = 40; panY = 20; updateTransform(); }

// Init
render();
</script>
</body>
</html>
